<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% from "partials/_head.html" import head %}{{ head('最佳实践') }}
</head>
<body class="min-h-screen" x-data="bestPracticesPage()" x-init="init()">
<div class="flex min-h-screen">
{% set active_nav = 'best-practices' %}
{% include "partials/_sidebar.html" %}
<div class="flex-1 ml-56">
    <header class="bg-white border-b border-[var(--border)] px-8 py-3 flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center gap-3">
            <h1 class="text-base font-semibold">最佳实践</h1>
            <span class="text-xs text-[var(--text-tertiary)] mono" x-text="practices.length + ' practices'"></span>
        </div>
    </header>
    <main class="p-8 space-y-6">
        <!-- Stats -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="card p-4">
                <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Total Practices</p>
                <p class="stat-num text-[var(--text-primary)]" x-text="practices.length"></p>
            </div>
            <div class="card p-4">
                <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Avg Rating</p>
                <p class="stat-num text-[var(--text-primary)]" x-text="avgRating.toFixed(1)"></p>
            </div>
            <div class="card p-4">
                <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Total Views</p>
                <p class="stat-num text-[var(--text-primary)]" x-text="totalViews"></p>
            </div>
            <div class="card p-4">
                <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Total Savings</p>
                <p class="stat-num text-[var(--text-primary)] mono" x-text="'¥' + totalSavings.toLocaleString()"></p>
            </div>
        </div>

        <!-- Filters -->
        <div class="card p-4 flex items-center gap-3 flex-wrap">
            <div class="flex-1 min-w-48">
                <input type="text" x-model="search" placeholder="Search practices..." class="w-full px-3 py-2 text-sm bg-[var(--bg)] border border-[var(--border)] rounded-lg text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)] focus:border-[#d4d4d4] outline-none">
            </div>
            <select x-model="filterCategory" class="px-3 py-2 text-sm bg-white border border-[var(--border)] rounded-lg text-[var(--text-primary)] focus:border-[#d4d4d4] outline-none">
                <option value="">All Categories</option>
                <option value="TPM">TPM</option>
                <option value="5S">5S</option>
                <option value="Quality">Quality</option>
                <option value="Digital">Digital</option>
                <option value="Lean Core">Lean Core</option>
            </select>
            <select x-model="filterDifficulty" class="px-3 py-2 text-sm bg-white border border-[var(--border)] rounded-lg text-[var(--text-primary)] focus:border-[#d4d4d4] outline-none">
                <option value="">All Levels</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
            <select x-model="sortBy" class="px-3 py-2 text-sm bg-white border border-[var(--border)] rounded-lg text-[var(--text-primary)] focus:border-[#d4d4d4] outline-none">
                <option value="views">Most Viewed</option>
                <option value="rating">Highest Rated</option>
                <option value="savings">Most Savings</option>
                <option value="recent">Most Recent</option>
            </select>
        </div>

        <!-- Practices Grid -->
        <div class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
            <template x-for="p in filteredPractices" :key="p.id">
                <div class="card p-5">
                    <div class="flex items-start justify-between mb-2">
                        <span class="pill bg-[#f4f4f5] text-[var(--text-primary)]" x-text="p.category"></span>
                        <span class="text-xs text-[var(--text-tertiary)]" x-text="p.subcategory"></span>
                    </div>
                    <h3 class="font-semibold text-sm text-[var(--text-primary)] mb-1" x-text="p.title"></h3>
                    <p class="text-xs text-[var(--text-secondary)] mb-3 line-clamp-2" x-text="p.description"></p>
                    
                    <div class="flex items-center gap-3 text-xs text-[var(--text-tertiary)] mb-3">
                        <span class="pill bg-[#f4f4f5] text-[var(--text-secondary)]" x-text="p.difficulty_level"></span>
                        <span x-text="p.implementation_time_days + ' days'"></span>
                        <span class="mono" x-text="'¥' + (p.estimated_saving || 0).toLocaleString()"></span>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-[var(--border)]">
                        <div class="flex items-center gap-0.5">
                            <template x-for="i in 5" :key="i">
                                <svg class="w-3.5 h-3.5" :class="i <= getRating(p.id) ? 'text-[var(--warning)]' : 'text-[var(--border)]'" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                </svg>
                            </template>
                            <span class="text-xs text-[var(--text-tertiary)] ml-1 mono" x-text="getRating(p.id).toFixed(1)"></span>
                        </div>
                        <div class="flex items-center gap-3 text-xs text-[var(--text-tertiary)]">
                            <span x-text="p.view_count + ' views'"></span>
                            <span x-text="p.usage_count + ' uses'"></span>
                        </div>
                    </div>

                    <!-- Tags -->
                    <div x-show="p.tags" class="mt-3 flex flex-wrap gap-1">
                        <template x-for="t in (p.tags || '').split(',')" :key="t">
                            <span class="pill bg-[#f4f4f5] text-[var(--text-tertiary)]" x-text="t.trim()"></span>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- Recent Comments -->
        <div class="card p-5">
            <h3 class="font-semibold text-sm text-[var(--text-primary)] mb-4">Recent Comments</h3>
            <div class="space-y-3">
                <template x-for="c in comments.slice(0, 10)" :key="c.id">
                    <div class="p-3 bg-[var(--bg)] rounded-lg border border-[var(--border)]">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-medium text-sm text-[var(--text-primary)]" x-text="getPracticeTitle(c.practice_id)"></span>
                            <span class="text-xs text-[var(--text-tertiary)] mono">User #<span x-text="c.user_id"></span></span>
                        </div>
                        <p class="text-sm text-[var(--text-secondary)]" x-text="c.comment"></p>
                        <div x-show="c.rating" class="flex items-center gap-1 mt-1">
                            <span class="text-xs text-[var(--text-tertiary)]">Rating</span>
                            <span class="text-xs font-medium text-[var(--warning)] mono" x-text="c.rating + '/5'"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>
</div>
</div>
<script>
function bestPracticesPage() {
    return {
        practices: [],
        comments: [],
        votes: [],
        search: '',
        filterCategory: '',
        filterDifficulty: '',
        sortBy: 'views',

        async init() {
            await Promise.all([this.loadPractices(), this.loadComments(), this.loadVotes()]);
        },

        async loadPractices() {
            try {
                const res = await fetch('/api/v1/best-practices');
                this.practices = await res.json();
            } catch(e) { console.error(e); }
        },
        async loadComments() {
            try {
                const res = await fetch('/api/v1/best-practices/comments');
                this.comments = await res.json();
            } catch(e) { console.error(e); }
        },
        async loadVotes() {
            try {
                const res = await fetch('/api/v1/best-practices/votes');
                this.votes = await res.json();
            } catch(e) { console.error(e); }
        },

        get filteredPractices() {
            let list = this.practices.filter(p => {
                if (this.search && !p.title.toLowerCase().includes(this.search.toLowerCase())) return false;
                if (this.filterCategory && p.category !== this.filterCategory) return false;
                if (this.filterDifficulty && p.difficulty_level !== this.filterDifficulty) return false;
                return true;
            });
            if (this.sortBy === 'views') list.sort((a, b) => (b.view_count || 0) - (a.view_count || 0));
            else if (this.sortBy === 'rating') list.sort((a, b) => this.getRating(b.id) - this.getRating(a.id));
            else if (this.sortBy === 'savings') list.sort((a, b) => (b.actual_saving || 0) - (a.actual_saving || 0));
            return list;
        },

        getRating(pid) {
            const pComments = this.comments.filter(c => c.practice_id === pid && c.rating);
            if (!pComments.length) return 0;
            return pComments.reduce((a, c) => a + c.rating, 0) / pComments.length;
        },

        getPracticeTitle(pid) {
            const p = this.practices.find(p => p.id === pid);
            return p ? p.title : 'Practice #' + pid;
        },

        get avgRating() {
            if (!this.practices.length) return 0;
            const ratings = this.practices.map(p => this.getRating(p.id)).filter(r => r > 0);
            return ratings.length ? ratings.reduce((a, b) => a + b) / ratings.length : 0;
        },

        get totalViews() {
            return this.practices.reduce((a, p) => a + (p.view_count || 0), 0);
        },

        get totalSavings() {
            return this.practices.reduce((a, p) => a + (p.actual_saving || p.estimated_saving || 0), 0);
        }
    }
}
</script>
</body>
</html>
