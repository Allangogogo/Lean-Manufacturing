<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% from "partials/_head.html" import head %}{{ head('5S & Kaizen') }}
</head>
<body class="min-h-screen" x-data="fivesKaizen()">
<div class="flex min-h-screen">
{% set active_nav = 'fives' %}
{% include "partials/_sidebar.html" %}
<div class="flex-1 ml-56">
    <header class="bg-white border-b border-[var(--border)] px-8 py-3 flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center gap-3">
            <h1 class="text-base font-semibold">5S & Kaizen</h1>
        </div>
        <div class="flex gap-1">
            <button @click="activeTab = '5s'" class="tab" :class="activeTab === '5s' ? 'active' : ''">5S Audit</button>
            <button @click="activeTab = 'kaizen'" class="tab" :class="activeTab === 'kaizen' ? 'active' : ''">Kaizen</button>
        </div>
    </header>
    <main class="p-8 space-y-6">
        <!-- ========== 5S Tab ========== -->
        <div x-show="activeTab === '5s'" x-cloak class="space-y-6">
            <!-- 5S Stats -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="card p-4">
                    <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Areas</p>
                    <p class="stat-num text-[var(--text-primary)]" x-text="areas.length"></p>
                </div>
                <div class="card p-4">
                    <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Total Audits</p>
                    <p class="stat-num text-[var(--text-primary)]" x-text="audits.length"></p>
                </div>
                <div class="card p-4">
                    <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Avg Score</p>
                    <p class="stat-num text-[var(--text-primary)]" x-text="avgScore + '%'"></p>
                </div>
                <div class="card p-4">
                    <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Improvements</p>
                    <p class="stat-num text-[var(--text-primary)]" x-text="improvements.length"></p>
                </div>
            </div>

            <!-- 5S Trend Chart -->
            <div class="card p-5">
                <h3 class="text-sm font-semibold text-[var(--text-primary)] mb-4">5S Score Trend</h3>
                <canvas id="fivesTrendChart" height="200"></canvas>
            </div>

            <!-- Area Score Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <template x-for="area in areasWithScores" :key="area.id">
                    <div class="card p-5">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <h3 class="text-sm font-semibold text-[var(--text-primary)]" x-text="area.name"></h3>
                                <p class="text-xs text-[var(--text-tertiary)] mono" x-text="area.code || ''"></p>
                            </div>
                            <div class="w-14 h-14 rounded-full flex items-center justify-center font-bold text-sm" :style="`background: conic-gradient(${scoreColor(area.latestPct)} ${area.latestPct}%, #f0f0f0 0); color: ${scoreColor(area.latestPct)}`" x-text="area.latestPct + '%'"></div>
                        </div>
                        <!-- 5S mini bars per category -->
                        <div class="space-y-2">
                            <template x-for="cat in ['seiri','seiton','seiso','seiketsu','shitsuke']" :key="cat">
                                <div class="flex items-center gap-2 text-xs">
                                    <span class="w-16 text-[var(--text-tertiary)] capitalize" x-text="cat.substring(0,5)"></span>
                                    <div class="bar flex-1">
                                        <div :style="`width: ${area.catScores[cat] || 0}%; background: ${scoreColor(area.catScores[cat] || 0)}`"></div>
                                    </div>
                                    <span class="w-8 text-right text-[var(--text-secondary)] mono" x-text="(area.catScores[cat] || 0) + '%'"></span>
                                </div>
                            </template>
                        </div>
                        <div class="mt-3 pt-3 border-t border-[var(--border)] text-xs text-[var(--text-tertiary)] mono" x-text="'Last audit: ' + (area.latestDate || 'N/A')"></div>
                    </div>
                </template>
            </div>
        </div>

        <!-- ========== Kaizen Tab ========== -->
        <div x-show="activeTab === 'kaizen'" x-cloak class="space-y-6">
            <!-- Kaizen Stats -->
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
                <div class="card p-4">
                    <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Total</p>
                    <p class="stat-num text-[var(--text-primary)]" x-text="kaizenList.length"></p>
                </div>
                <div class="card p-4">
                    <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Proposed</p>
                    <p class="stat-num text-[var(--text-primary)]" x-text="kaizenList.filter(k=>k.status==='proposed').length"></p>
                </div>
                <div class="card p-4">
                    <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">In Progress</p>
                    <p class="stat-num text-[var(--text-primary)]" x-text="kaizenList.filter(k=>k.status==='in_progress').length"></p>
                </div>
                <div class="card p-4">
                    <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Completed</p>
                    <p class="stat-num text-[var(--text-primary)]" x-text="kaizenList.filter(k=>k.status==='completed').length"></p>
                </div>
                <div class="card p-4">
                    <p class="text-xs text-[var(--text-tertiary)] uppercase tracking-wider">Total Savings</p>
                    <p class="stat-num text-[var(--text-primary)]" x-text="formatCurrency(totalSavings)"></p>
                </div>
            </div>

            <!-- Filters -->
            <div class="flex gap-3">
                <select x-model="kaizenFilter" class="px-3 py-2 text-sm bg-white border border-[var(--border)] rounded-lg text-[var(--text-primary)] focus:border-[#d4d4d4] outline-none">
                    <option value="all">All Status</option>
                    <option value="proposed">Proposed</option>
                    <option value="approved">Approved</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
                <select x-model="kaizenCatFilter" class="px-3 py-2 text-sm bg-white border border-[var(--border)] rounded-lg text-[var(--text-primary)] focus:border-[#d4d4d4] outline-none">
                    <option value="all">All Categories</option>
                    <option value="process">Process</option>
                    <option value="quality">Quality</option>
                    <option value="equipment">Equipment</option>
                    <option value="workplace">Workplace</option>
                    <option value="logistics">Logistics</option>
                    <option value="management">Management</option>
                </select>
            </div>

            <!-- Kaizen Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="k in filteredKaizen" :key="k.id">
                    <div class="card p-5">
                        <div class="flex items-start justify-between mb-2">
                            <h3 class="text-sm font-semibold text-[var(--text-primary)] leading-tight" x-text="k.title"></h3>
                            <span class="pill shrink-0 ml-2" :class="kaizenStatusClass(k.status)" x-text="k.status"></span>
                        </div>
                        <p class="text-xs text-[var(--text-secondary)] mb-3 line-clamp-2" x-text="k.description"></p>
                        
                        <div class="flex items-center gap-1.5 mb-2">
                            <span class="pill bg-[#f4f4f5] text-[var(--text-secondary)]" x-text="k.category"></span>
                            <span class="pill" :class="kaizenPriorityClass(k.priority)" x-text="k.priority"></span>
                        </div>

                        <div x-show="k.solution" class="text-xs text-[var(--text-secondary)] mb-2">
                            <span class="font-medium text-[var(--text-tertiary)]">Solution:</span> <span x-text="k.solution"></span>
                        </div>

                        <div class="flex items-center justify-between mt-3 pt-3 border-t border-[var(--border)] text-xs">
                            <div class="flex items-center gap-3">
                                <span x-show="k.expected_saving" class="text-[var(--text-primary)] font-medium mono" x-text="'Est: ' + formatCurrency(k.expected_saving)"></span>
                                <span x-show="k.actual_saving" class="text-[var(--positive)] font-medium mono" x-text="'Actual: ' + formatCurrency(k.actual_saving)"></span>
                            </div>
                            <span class="text-[var(--text-tertiary)] mono" x-text="k.due_date || ''"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>
</div>
</div>
<script>
const API_BASE = '/api/v1';

function fivesKaizen() {
    return {
        activeTab: '5s',
        areas: [],
        audits: [],
        improvements: [],
        kaizenList: [],
        kaizenFilter: 'all',
        kaizenCatFilter: 'all',
        trendChart: null,

        async init() {
            await Promise.all([
                this.loadAreas(),
                this.loadAudits(),
                this.loadImprovements(),
                this.loadKaizen(),
            ]);
            this.$nextTick(() => this.renderTrendChart());
        },

        async loadAreas() {
            try {
                const res = await fetch(`${API_BASE}/5s/areas`);
                this.areas = await res.json();
            } catch(e) { console.error('loadAreas', e); }
        },

        async loadAudits() {
            try {
                const res = await fetch(`${API_BASE}/5s/audits`);
                this.audits = await res.json();
            } catch(e) { console.error('loadAudits', e); }
        },

        async loadImprovements() {
            try {
                const res = await fetch(`${API_BASE}/5s/improvements`);
                this.improvements = await res.json();
            } catch(e) { console.error('loadImprovements', e); }
        },

        async loadKaizen() {
            try {
                const res = await fetch(`${API_BASE}/kaizen/proposals`);
                this.kaizenList = await res.json();
            } catch(e) { console.error('loadKaizen', e); }
        },

        get areasWithScores() {
            return this.areas.map(area => {
                const areaAudits = this.audits.filter(a => a.area_id === area.id)
                    .sort((a, b) => (b.completed_date || '').localeCompare(a.completed_date || ''));
                const latest = areaAudits[0];
                const latestPct = latest ? Math.round((latest.score / latest.max_score) * 100) : 0;
                const latestDate = latest ? (latest.completed_date || '').substring(0, 10) : '';
                
                const catScores = {};
                if (latest) {
                    const items = latest.items || [];
                    const catGroups = {};
                    items.forEach(item => {
                        if (!catGroups[item.s_category]) catGroups[item.s_category] = { score: 0, max: 0 };
                        catGroups[item.s_category].score += parseFloat(item.score || 0);
                        catGroups[item.s_category].max += parseFloat(item.max_score || 5);
                    });
                    for (const [cat, vals] of Object.entries(catGroups)) {
                        catScores[cat] = vals.max > 0 ? Math.round(vals.score / vals.max * 100) : 0;
                    }
                }

                return { ...area, latestPct, latestDate, catScores };
            });
        },

        get avgScore() {
            const completed = this.audits.filter(a => a.status === 'completed' && a.max_score > 0);
            if (!completed.length) return 0;
            return Math.round(completed.reduce((s, a) => s + (a.score / a.max_score * 100), 0) / completed.length);
        },

        get filteredKaizen() {
            return this.kaizenList.filter(k => {
                if (this.kaizenFilter !== 'all' && k.status !== this.kaizenFilter) return false;
                if (this.kaizenCatFilter !== 'all' && k.category !== this.kaizenCatFilter) return false;
                return true;
            });
        },

        get totalSavings() {
            return this.kaizenList.reduce((s, k) => s + (parseFloat(k.actual_saving) || 0), 0);
        },

        renderTrendChart() {
            const canvas = document.getElementById('fivesTrendChart');
            if (!canvas) return;
            
            const byDate = {};
            this.audits.filter(a => a.status === 'completed').forEach(a => {
                const d = (a.completed_date || '').substring(0, 7);
                if (!byDate[d]) byDate[d] = [];
                byDate[d].push(a.max_score > 0 ? (a.score / a.max_score * 100) : 0);
            });
            
            const labels = Object.keys(byDate).sort();
            const data = labels.map(d => Math.round(byDate[d].reduce((s,v)=>s+v,0)/byDate[d].length));
            
            if (this.trendChart) this.trendChart.destroy();
            this.trendChart = new Chart(canvas, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: '5S Score %',
                        data,
                        borderColor: '#18181b',
                        backgroundColor: 'rgba(24,24,27,0.05)',
                        fill: true,
                        tension: 0.4,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { min: 0, max: 100, ticks: { callback: v => v + '%' } },
                    }
                }
            });
        },

        scoreColor(pct) {
            if (pct >= 80) return '#16a34a';
            if (pct >= 60) return '#ea580c';
            return '#dc2626';
        },

        formatCurrency(n) {
            if (!n) return '-';
            if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
            return n.toLocaleString();
        },

        kaizenStatusClass(status) {
            const m = {
                proposed: 'bg-[#f4f4f5] text-[var(--text-secondary)]',
                approved: 'bg-[#f4f4f5] text-[var(--text-primary)]',
                in_progress: 'bg-orange-50 text-[var(--warning)]',
                completed: 'bg-green-50 text-[var(--positive)]',
                rejected: 'bg-red-50 text-[var(--negative)]'
            };
            return m[status] || 'bg-[#f4f4f5] text-[var(--text-secondary)]';
        },

        kaizenPriorityClass(pri) {
            const m = {
                P1: 'bg-red-50 text-[var(--negative)]',
                P2: 'bg-orange-50 text-[var(--warning)]',
                P3: 'bg-amber-50 text-[var(--warning)]'
            };
            return m[pri] || 'bg-[#f4f4f5] text-[var(--text-secondary)]';
        },
    };
}
</script>
</body>
</html>
