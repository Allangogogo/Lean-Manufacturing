<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品WIP库存培训动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', sans-serif;
    background: #0a0e27;
    color: #e0e0e0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== Header ===== */
  .header {
    text-align: center;
    padding: 30px 20px 10px;
  }
  .header h1 {
    font-size: 28px;
    color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,.3);
  }
  .header p { color: #888; margin-top: 6px; font-size: 14px; }

  /* ===== Formula Bar ===== */
  .formula-bar {
    background: linear-gradient(135deg, #111633, #1a1f4e);
    border: 1px solid #2a3060;
    border-radius: 12px;
    margin: 20px auto;
    padding: 20px 30px;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 22px;
    font-weight: bold;
    flex-wrap: wrap;
  }
  .formula-bar .f-part {
    padding: 8px 16px;
    border-radius: 8px;
    opacity: 0.15;
    transition: all 0.6s ease;
  }
  .formula-bar .f-part.show { opacity: 1; }
  .formula-bar .f-wip { background: rgba(255,61,0,.2); color: #ff6e40; border: 1px solid rgba(255,61,0,.4); }
  .formula-bar .f-output { background: rgba(0,230,118,.2); color: #69f0ae; border: 1px solid rgba(0,230,118,.4); }
  .formula-bar .f-turn { background: rgba(41,182,246,.2); color: #40c4ff; border: 1px solid rgba(41,182,246,.4); }
  .formula-bar .f-op { color: #666; opacity: 0.15; transition: opacity 0.6s; }
  .formula-bar .f-op.show { opacity: 1; }

  /* ===== Process Pipeline ===== */
  .pipeline-section {
    margin: 20px auto;
    max-width: 1100px;
    padding: 0 20px;
  }
  .pipeline-title {
    font-size: 16px;
    color: #888;
    margin-bottom: 12px;
    text-align: center;
  }
  .pipeline-wrap {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 0;
    min-height: 200px;
  }

  .process-card {
    background: linear-gradient(180deg, #151a3a, #111430);
    border: 1px solid #2a3060;
    border-radius: 12px;
    width: 160px;
    text-align: center;
    padding: 14px 10px;
    position: relative;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .process-card.bottleneck {
    border-color: #ff3d00;
    box-shadow: 0 0 20px rgba(255,61,0,.3);
  }
  .process-card .pc-name {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .process-card .pc-icon { font-size: 28px; margin-bottom: 6px; }
  .process-card .pc-info { font-size: 11px; color: #999; line-height: 1.6; }
  .process-card .pc-lt {
    margin-top: 8px;
    font-size: 13px;
    color: #40c4ff;
  }
  .process-card .pc-value {
    margin-top: 4px;
    font-size: 11px;
    color: #69f0ae;
  }

  /* Backlog bar above card */
  .backlog-wrap {
    height: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 4px;
  }
  .backlog-bar {
    width: 40px;
    background: linear-gradient(180deg, #ff3d00, #ff6e40);
    border-radius: 4px 4px 0 0;
    transition: height 0.5s ease;
    min-height: 2px;
    position: relative;
  }
  .backlog-bar::after {
    content: attr(data-count);
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #ff6e40;
    white-space: nowrap;
  }

  /* Arrow between cards */
  .arrow-zone {
    width: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-top: 40px;
  }
  .arrow-zone .arrow-line {
    width: 100%;
    height: 2px;
    background: #2a3060;
    position: relative;
  }
  .arrow-zone .arrow-head {
    position: absolute;
    right: -2px;
    top: -5px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 10px solid #2a3060;
  }

  /* Moving work pieces on arrow */
  .work-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #40c4ff;
    border-radius: 50%;
    top: -3px;
    box-shadow: 0 0 6px rgba(64,196,255,.6);
    animation: movePiece linear infinite;
  }
  @keyframes movePiece {
    0% { left: 0; }
    100% { left: calc(100% - 8px); }
  }

  /* ===== Dashboard ===== */
  .dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 20px;
  }
  .dash-card {
    background: linear-gradient(180deg, #111633, #0d1030);
    border: 1px solid #2a3060;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .dash-card .dc-label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .dash-card .dc-value {
    font-size: 32px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  .dash-card .dc-unit { font-size: 12px; color: #666; margin-top: 2px; }
  .dc-wip .dc-value { color: #ff6e40; }
  .dc-turn .dc-value { color: #40c4ff; }
  .dc-output .dc-value { color: #69f0ae; }
  .dc-bottleneck .dc-value { color: #ffab40; font-size: 20px; }

  /* ===== Leadtime Bar Chart ===== */
  .chart-section {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 20px;
  }
  .chart-section h3 { font-size: 14px; color: #888; margin-bottom: 10px; text-align: center; }
  .lt-bars { display: flex; align-items: flex-end; justify-content: center; gap: 24px; height: 140px; }
  .lt-bar-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .lt-bar-item .bar {
    width: 50px;
    border-radius: 6px 6px 0 0;
    transition: height 0.6s ease, background 0.3s;
    min-height: 4px;
  }
  .lt-bar-item .bar-label { font-size: 11px; color: #aaa; }
  .lt-bar-item .bar-val { font-size: 12px; font-weight: bold; }

  /* ===== Controls ===== */
  .controls {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .ctrl-group {
    background: linear-gradient(180deg, #111633, #0d1030);
    border: 1px solid #2a3060;
    border-radius: 10px;
    padding: 16px;
  }
  .ctrl-group label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 8px;
  }
  .ctrl-group label span { float: right; color: #40c4ff; font-weight: bold; }
  .ctrl-group input[type=range] {
    width: 100%;
    accent-color: #40c4ff;
    cursor: pointer;
  }
  .ctrl-group select {
    width: 100%;
    background: #1a1f4e;
    color: #e0e0e0;
    border: 1px solid #2a3060;
    border-radius: 6px;
    padding: 8px;
    font-size: 14px;
  }

  .btn-row {
    max-width: 1100px;
    margin: 16px auto;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 0 20px;
  }
  .btn {
    padding: 10px 28px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-play { background: #00e676; color: #0a0e27; }
  .btn-play:hover { background: #69f0ae; }
  .btn-reset { background: #2a3060; color: #aaa; }
  .btn-reset:hover { background: #3a4080; }

  /* ===== Insight ===== */
  .insight-bar {
    max-width: 1100px;
    margin: 16px auto 30px;
    padding: 14px 24px;
    background: linear-gradient(135deg, #1a1535, #151a40);
    border-left: 4px solid #ffab40;
    border-radius: 0 10px 10px 0;
    font-size: 14px;
    line-height: 1.7;
    color: #ccc;
    min-height: 60px;
    transition: all 0.5s;
  }
  .insight-bar strong { color: #ffab40; }

  /* ===== Work Piece Animation Overlay ===== */
  .wp-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .main-content { position: relative; z-index: 1; }

  /* responsive */
  @media (max-width: 700px) {
    .dashboard { grid-template-columns: repeat(2, 1fr); }
    .pipeline-wrap { flex-wrap: wrap; gap: 8px; justify-content: center; }
    .arrow-zone { display: none; }
  }
</style>
</head>
<body>

<div class="main-content">
  <!-- Header -->
  <div class="header">
    <h1>🔩 产品WIP库存与Leadtime关系</h1>
    <p>理解工序瓶颈如何导致在制品(WIP)堆积和资金占用</p>
  </div>

  <!-- Formula -->
  <div class="formula-bar">
    <div class="f-part f-wip" id="f-wip">WIP库存金额</div>
    <span class="f-op" id="f-eq">=</span>
    <div class="f-part f-output" id="f-output">日均产出金额</div>
    <span class="f-op" id="f-mul">×</span>
    <div class="f-part f-turn" id="f-turn">库存周转天数</div>
  </div>

  <!-- Pipeline -->
  <div class="pipeline-section">
    <div class="pipeline-title">▼ 工件在各道工序间流动（瓶颈前堆积）</div>
    <div class="pipeline-wrap" id="pipeline"></div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="dash-card dc-wip">
      <div class="dc-label">WIP库存金额</div>
      <div class="dc-value" id="d-wip">0</div>
      <div class="dc-unit">万元</div>
    </div>
    <div class="dash-card dc-turn">
      <div class="dc-label">库存周转天数</div>
      <div class="dc-value" id="d-turn">0</div>
      <div class="dc-unit">天</div>
    </div>
    <div class="dash-card dc-output">
      <div class="dc-label">日均产出</div>
      <div class="dc-value" id="d-output">0</div>
      <div class="dc-unit">万元/天</div>
    </div>
    <div class="dash-card dc-bottleneck">
      <div class="dc-label">当前瓶颈</div>
      <div class="dc-value" id="d-bn">—</div>
    </div>
  </div>

  <!-- Leadtime Chart -->
  <div class="chart-section">
    <h3>各工序Leadtime（天）</h3>
    <div class="lt-bars" id="lt-bars"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="ctrl-group">
      <label>投料速率 <span id="v-rate">100</span> 件/天</label>
      <input type="range" id="s-rate" min="20" max="300" value="100" step="10">
    </div>
    <div class="ctrl-group">
      <label>瓶颈工序（产出减半）</label>
      <select id="s-bn">
        <option value="0">机加工</option>
        <option value="1">搓牙</option>
        <option value="2" selected>热处理</option>
        <option value="3">电镀</option>
        <option value="4">装配包装</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>物料单价 <span id="v-price">1.0</span> 元/件</label>
      <input type="range" id="s-price" min="0.2" max="5" value="1.0" step="0.1">
    </div>
    <div class="ctrl-group">
      <label>模拟速度 <span id="v-speed">1</span>×</label>
      <input type="range" id="s-speed" min="1" max="10" value="1" step="1">
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-play" id="btn-play" onclick="toggleSim()">▶ 开始模拟</button>
    <button class="btn btn-reset" onclick="resetSim()">⟲ 重置</button>
  </div>

  <!-- Insight -->
  <div class="insight-bar" id="insight">
    💡 点击「开始模拟」，观察瓶颈工序如何导致WIP堆积。可切换瓶颈工序、调整投料速率和物料单价，实时观察WIP金额变化。
  </div>
</div>

<script>
// ===== State =====
const PROCESSES = [
  { name: '机加工',     icon: '🔨', equip: 3,  baseLT: 1.0, valueAdd: 0.3 },
  { name: '搓牙',     icon: '⚙️',  equip: 4,  baseLT: 0.8, valueAdd: 0.2 },
  { name: '热处理',   icon: '🔥', equip: 2,  baseLT: 1.5, valueAdd: 0.5 },
  { name: '电镀',     icon: '💧', equip: 2,  baseLT: 1.2, valueAdd: 0.4 },
  { name: '装配包装', icon: '📦', equip: 2,  baseLT: 0.8, valueAdd: 0.2 }
];

let state = {
  running: false,
  tick: 0,
  rate: 100,          // pieces/day input
  bottleneck: 2,      // index
  pricePerPiece: 1.0, // yuan
  speed: 1,
  backlog: [0,0,0,0,0], // pieces waiting at each station
  simTimer: null
};

const BASE_DAILY_OUTPUT = 100; // normal output without bottleneck

// ===== Init Pipeline HTML =====
function buildPipeline() {
  const wrap = document.getElementById('pipeline');
  wrap.innerHTML = '';
  PROCESSES.forEach((p, i) => {
    // Backlog bar
    const bw = document.createElement('div');
    bw.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
    bw.innerHTML = `
      <div class="backlog-wrap">
        <div class="backlog-bar" id="bl-${i}" style="height:2px" data-count="0"></div>
      </div>
      <div class="process-card" id="pc-${i}">
        <div class="pc-icon">${p.icon}</div>
        <div class="pc-name">${p.name}</div>
        <div class="pc-info">${p.equip}台设备 | 增值 ¥${p.valueAdd.toFixed(1)}/件</div>
        <div class="pc-lt" id="lt-${i}">Leadtime: ${p.baseLT.toFixed(1)}天</div>
        <div class="pc-value" id="pv-${i}">在制品: 0件</div>
      </div>
    `;
    wrap.appendChild(bw);

    // Arrow
    if (i < PROCESSES.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = 'arrow-zone';
      arrow.innerHTML = `<div class="arrow-line"><div class="arrow-head"></div></div>`;
      arrow.id = `arrow-${i}`;
      wrap.appendChild(arrow);
    }
  });
}

// ===== Init Leadtime Chart =====
function buildChart() {
  const container = document.getElementById('lt-bars');
  container.innerHTML = '';
  PROCESSES.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'lt-bar-item';
    const maxH = 120;
    const maxLT = 3;
    const h = Math.max(4, (p.baseLT / maxLT) * maxH);
    const colors = ['#42a5f5','#66bb6a','#ff7043','#ab47bc','#ffa726'];
    item.innerHTML = `
      <div class="bar-val" id="barv-${i}">${p.baseLT.toFixed(1)}天</div>
      <div class="bar" id="bar-${i}" style="height:${h}px;background:${colors[i]}"></div>
      <div class="bar-label">${p.name}</div>
    `;
    container.appendChild(item);
  });
}

// ===== Update Display =====
function updateDisplay() {
  // Backlog bars
  PROCESSES.forEach((_, i) => {
    const bl = state.backlog[i];
    const maxBl = 500;
    const h = Math.max(2, (bl / maxBl) * 46);
    const bar = document.getElementById(`bl-${i}`);
    if (bar) {
      bar.style.height = h + 'px';
      bar.setAttribute('data-count', bl > 0 ? bl + '件' : '');
      bar.style.background = bl > 200
        ? 'linear-gradient(180deg, #ff3d00, #ff6e40)'
        : bl > 50
          ? 'linear-gradient(180deg, #ffab40, #ffca28)'
          : 'linear-gradient(180deg, #26a69a, #69f0ae)';
    }

    const card = document.getElementById(`pc-${i}`);
    if (card) {
      card.className = 'process-card' + (i === state.bottleneck ? ' bottleneck' : '');
    }

    const pv = document.getElementById(`pv-${i}`);
    if (pv) pv.textContent = `在制品: ${bl}件`;
  });

  // Arrow animation speed
  PROCESSES.forEach((_, i) => {
    const arrow = document.getElementById(`arrow-${i}`);
    if (!arrow) return;
    let existing = arrow.querySelector('.work-piece');
    if (state.running) {
      if (!existing) {
        existing = document.createElement('div');
        existing.className = 'work-piece';
        arrow.querySelector('.arrow-line').appendChild(existing);
      }
      const speed = i === state.bottleneck ? '3s' : '1s';
      existing.style.animationDuration = speed;
      existing.style.background = i === state.bottleneck ? '#ff6e40' : '#40c4ff';
    } else {
      if (existing) existing.remove();
    }
  });

  // Leadtime chart with bottleneck effect
  PROCESSES.forEach((p, i) => {
    const lt = i === state.bottleneck ? p.baseLT * 2 : p.baseLT;
    const maxLT = 4;
    const maxH = 120;
    const h = Math.max(4, (lt / maxLT) * maxH);
    const bar = document.getElementById(`bar-${i}`);
    if (bar) {
      bar.style.height = h + 'px';
      bar.style.background = i === state.bottleneck ? '#ff3d00' : bar.style.background;
    }
    const bv = document.getElementById(`barv-${i}`);
    if (bv) bv.textContent = lt.toFixed(1) + '天';
    const ltEl = document.getElementById(`lt-${i}`);
    if (ltEl) ltEl.textContent = `Leadtime: ${lt.toFixed(1)}天`;
  });

  // Calculate totals
  const totalBacklog = state.backlog.reduce((a, b) => a + b, 0);
  const totalValue = totalBacklog * state.pricePerPiece;
  const avgDailyOutput = state.rate * state.pricePerPiece;
  const totalLT = PROCESSES.reduce((s, p, i) => {
    return s + (i === state.bottleneck ? p.baseLT * 2 : p.baseLT);
  }, 0);
  const turnoverDays = avgDailyOutput > 0 ? totalValue / avgDailyOutput : 0;

  // Daily output in 万元
  const dailyWan = (avgDailyOutput / 10000).toFixed(2);
  const wipWan = (totalValue / 10000).toFixed(2);

  animateNum('d-wip', parseFloat(wipWan), 1);
  animateNum('d-turn', parseFloat(turnoverDays.toFixed(1)), 1);
  animateNum('d-output', parseFloat(dailyWan), 2);

  const bnName = PROCESSES[state.bottleneck].name;
  document.getElementById('d-bn').textContent = bnName;

  // Insight
  updateInsight(totalBacklog, totalValue, turnoverDays, bnName);
}

let lastValues = {};
function animateNum(id, target, decimals) {
  const el = document.getElementById(id);
  if (!el) return;
  const prev = lastValues[id] || 0;
  const diff = target - prev;
  if (Math.abs(diff) < 0.01) return;
  const steps = 15;
  let step = 0;
  const timer = setInterval(() => {
    step++;
    const v = prev + (diff * step / steps);
    el.textContent = v.toFixed(decimals);
    if (step >= steps) {
      el.textContent = target.toFixed(decimals);
      clearInterval(timer);
      lastValues[id] = target;
    }
  }, 30);
}

function updateInsight(totalBL, totalVal, turnDays, bnName) {
  const el = document.getElementById('insight');
  const parts = [];

  if (totalBL === 0) {
    el.innerHTML = '💡 点击「开始模拟」，观察瓶颈工序如何导致WIP堆积。可切换瓶颈工序、调整投料速率和物料单价。';
    return;
  }

  const maxBL = Math.max(...state.backlog);
  const maxIdx = state.backlog.indexOf(maxBL);

  parts.push(`当前共有 <strong>${totalBL.toLocaleString()}</strong> 件在制品，占用资金 <strong>¥${totalVal.toLocaleString()}</strong>（${(totalVal/10000).toFixed(2)}万元）。`);

  if (maxBL > 0) {
    parts.push(`<strong>${PROCESSES[maxIdx].name}</strong>工序前积压最多（${maxBL}件），是当前最大瓶颈。`);
  }

  if (turnDays > 7) {
    parts.push(`⚠️ 库存周转天数 <strong>${turnDays.toFixed(1)}天</strong>，资金占用周期过长，建议优化瓶颈工序。`);
  } else if (turnDays > 3) {
    parts.push(`📋 库存周转天数 <strong>${turnDays.toFixed(1)}天</strong>，处于一般水平。`);
  } else {
    parts.push(`✅ 库存周转天数 <strong>${turnDays.toFixed(1)}天</strong>，表现良好。`);
  }

  // Formula verification
  parts.push(`验证公式：${(totalVal/10000).toFixed(2)}万 = ${(state.rate * state.pricePerPiece / 10000).toFixed(2)}万/天 × ${turnDays.toFixed(1)}天`);

  el.innerHTML = parts.join('<br>');
}

// ===== Simulation =====
function simStep() {
  state.tick++;

  // Bottleneck outputs fewer
  PROCESSES.forEach((p, i) => {
    const rate = i === state.bottleneck
      ? state.rate * 0.4   // bottleneck is slower
      : state.rate * 1.05;  // non-bottleneck slightly faster

    if (i === 0) {
      // First process: input from rate
      state.backlog[i] += state.rate;
      state.backlog[i] -= Math.min(state.backlog[i], state.rate);
    } else {
      // Input from previous process output
      const prevRate = (i-1 === state.bottleneck)
        ? state.rate * 0.4
        : state.rate * 1.05;
      const incoming = Math.min(state.backlog[i-1], prevRate);
      state.backlog[i-1] -= incoming;
      state.backlog[i] += incoming;
    }

    // Output from this station
    const output = Math.min(state.backlog[i], rate);
    state.backlog[i] -= output;
  });

  updateDisplay();
}

function toggleSim() {
  if (state.running) {
    clearInterval(state.simTimer);
    state.running = false;
    document.getElementById('btn-play').textContent = '▶ 继续模拟';
    document.getElementById('btn-play').style.background = '#00e676';
  } else {
    state.running = true;
    document.getElementById('btn-play').textContent = '⏸ 暂停';
    document.getElementById('btn-play').style.background = '#ffab40';
    state.simTimer = setInterval(simStep, 500);
  }
}

function resetSim() {
  if (state.running) {
    clearInterval(state.simTimer);
    state.running = false;
  }
  state.tick = 0;
  state.backlog = [0,0,0,0,0];
  lastValues = {};
  document.getElementById('btn-play').textContent = '▶ 开始模拟';
  document.getElementById('btn-play').style.background = '#00e676';
  ['d-wip','d-turn','d-output'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = '0';
  });
  document.getElementById('d-bn').textContent = '—';
  updateDisplay();
}

// ===== Controls =====
document.getElementById('s-rate').addEventListener('input', e => {
  state.rate = parseInt(e.target.value);
  document.getElementById('v-rate').textContent = state.rate;
  if (!state.running) updateDisplay();
});

document.getElementById('s-bn').addEventListener('change', e => {
  state.bottleneck = parseInt(e.target.value);
  if (!state.running) updateDisplay();
});

document.getElementById('s-price').addEventListener('input', e => {
  state.pricePerPiece = parseFloat(e.target.value);
  document.getElementById('v-price').textContent = state.pricePerPiece.toFixed(1);
  if (!state.running) updateDisplay();
});

document.getElementById('s-speed').addEventListener('input', e => {
  state.speed = parseInt(e.target.value);
  document.getElementById('v-speed').textContent = state.speed;
  if (state.running) {
    clearInterval(state.simTimer);
    state.simTimer = setInterval(simStep, 500 / state.speed);
  }
});

// ===== Formula Reveal Animation =====
function revealFormula() {
  const parts = ['f-eq', 'f-wip', 'f-mul', 'f-output', 'f-op', 'f-turn'];
  const order = ['f-wip', 'f-eq', 'f-output', 'f-mul', 'f-turn'];
  order.forEach((id, i) => {
    setTimeout(() => {
      document.getElementById(id).classList.add('show');
    }, 300 + i * 400);
  });
}

// ===== Init =====
buildPipeline();
buildChart();
revealFormula();
updateDisplay();
</script>
</body>
