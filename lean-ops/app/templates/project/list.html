{% extends "base.html" %}
{% block page_id %}projects{% endblock %}
{% block page_title %}项目管理{% endblock %}

{% block content %}
<div x-data="projectList()" x-init="init()">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-header-info">
      <h1>项目管理</h1>
      <p>管理和追踪所有精益改善项目</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-primary" @click="showCreateModal = true">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2v16m-8-8h16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
        新建项目
      </button>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon primary">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M7 4a3 3 0 100 6 3 3 0 000-6zm0 8c-3.5 0-6.5 2-6.5 4.5V18h13v-1.5c0-2.5-3-4.5-6.5-4.5zM14 4a2.5 2.5 0 100 5 2.5 2.5 0 000-5zm0 7c-1.5 0-3 .6-4.2 1.5 1.2 1 2.2 2.3 2.2 3.5v2h8v-2c0-2.5-3-4-6-4z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="stats.active || 0">0</div>
        <div class="stat-label">进行中项目</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon success">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1a9 9 0 100 18 9 9 0 000-18zm3.7 7.3l-4 4a1 1 0 01-1.4 0l-2-2a1 1 0 011.4-1.4L9 10.6l3.3-3.3a1 1 0 011.4 1.4z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="stats.completed || 0">0</div>
        <div class="stat-label">已完成项目</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon warning">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l9 17H1L10 1zm0 3.5L3.5 16h13L10 4.5zM9 8h2v4H9V8zm0 5h2v2H9v-2z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="overdueCount">0</div>
        <div class="stat-label">延期项目</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon accent">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="10" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">¥</text></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="fmtMoney(stats.total_budget)">¥0</div>
        <div class="stat-label">总预算</div>
      </div>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="card" style="margin-bottom: var(--space-5);">
    <div class="filter-bar">
      <div class="search-input">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M8 2a6 6 0 104.7 10.4l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 008 2zM8 4a4 4 0 110 8 4 4 0 010-8z"/></svg>
        <input class="form-input" x-model="filter.search" @input="onSearchChange()" placeholder="搜索项目名称...">
      </div>
      <select class="form-select" style="width: auto; min-width: 130px;" x-model="filter.status" @change="loadData()">
        <option value="">全部状态</option>
        <option value="planning">规划中</option>
        <option value="active">进行中</option>
        <option value="on_hold">暂停</option>
        <option value="completed">已完成</option>
        <option value="cancelled">已取消</option>
      </select>
      <select class="form-select" style="width: auto; min-width: 110px;" x-model="filter.priority" @change="loadData()">
        <option value="">全部优先级</option>
        <option value="low">低</option>
        <option value="medium">中</option>
        <option value="high">高</option>
        <option value="urgent">紧急</option>
      </select>
      <select class="form-select" style="width: auto; min-width: 130px;" x-model="filter.project_type" @change="loadData()">
        <option value="">全部类型</option>
        <option value="kaizen_event">Kaizen 活动</option>
        <option value="vsm_redux">价值流优化</option>
        <option value="5s_deployment">5S 推广</option>
        <option value="tpm_rollout">TPM 推广</option>
        <option value="training_program">培训项目</option>
      </select>
      <span class="badge badge-gray" x-text="'共 ' + pagination.total + ' 个项目'"></span>
    </div>
  </div>

  <!-- Project Cards Grid -->
  <div class="grid-2" x-show="items.length > 0">
    <template x-for="item in items" :key="item.id">
      <div class="card">
        <!-- Header -->
        <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--space-3);">
          <div style="flex: 1; min-width: 0;">
            <h3 style="font-size: var(--text-base); font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-1);" x-text="item.name"></h3>
            <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;">
              <span class="badge badge-outline" x-text="typeMap[item.project_type] || item.project_type"></span>
              <span x-html="LeanOps.statusBadge(item.status)"></span>
              <span x-html="LeanOps.priorityBadge(item.priority)"></span>
            </div>
          </div>
          <div style="display: flex; gap: var(--space-1); flex-shrink: 0;">
            <a :href="'/project/' + item.id" class="btn btn-sm btn-ghost" title="项目详情">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M8 9h2v7H8V9zm0-3h2v2H8V6zM10 1a9 9 0 100 18 9 9 0 000-18zm0 2a7 7 0 110 14 7 7 0 010-14z"/></svg>
            </a>
            <a :href="'/project/' + item.id + '/gantt'" class="btn btn-sm btn-ghost" title="甘特图">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M2 4h4v3H2V4zm6 0h4v3H8V4zm6 0h4v3h-4V4zM2 9h4v3H2V9zm6 0h4v3H8V9zm6 0h4v3h-4V9zM2 14h4v3H2v-3zm6 0h4v3H8v-3z"/></svg>
            </a>
            <a :href="'/project/' + item.id + '/risks'" class="btn btn-sm btn-ghost" title="风险管理">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l9 4v6a9 9 0 01-4 7.5L10 19l-5-1.5A9 9 0 012 10V5l8-4zm0 2.5L4 6.5V10a7 7 0 003 5.7l3 1 3-1A7 7 0 0016 10V6.5l-6-3z"/></svg>
            </a>
          </div>
        </div>

        <!-- Progress -->
        <div style="margin-bottom: var(--space-3);">
          <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-1);">
            <span style="font-size: var(--text-xs); color: var(--text-tertiary);">完成进度</span>
            <span style="font-size: var(--text-xs); font-weight: 600;" :class="{'color-success': item.progress_pct === 100, 'color-primary': item.progress_pct < 100}" x-text="item.progress_pct + '%'"></span>
          </div>
          <div class="progress">
            <div class="progress-bar" :class="{'success': item.progress_pct === 100}" :style="'width: ' + item.progress_pct + '%'"></div>
          </div>
        </div>

        <!-- Meta Info -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3);">
          <div style="display: flex; align-items: center; gap: var(--space-2);">
            <div class="avatar avatar-sm" x-text="LeanOps.initials(item.owner_name)"></div>
            <span style="font-size: var(--text-xs); color: var(--text-secondary);" x-text="item.owner_name"></span>
          </div>
          <div style="font-size: var(--text-xs); color: var(--text-tertiary);">
            <span x-text="item.start_date ? LeanOps.fmtDate(item.start_date) : '未设置'"></span>
            <span style="margin: 0 4px;">-</span>
            <span x-text="item.target_end_date ? LeanOps.fmtDate(item.target_end_date) : '未设置'"></span>
          </div>
        </div>

        <!-- Budget & Tasks Row -->
        <div style="display: flex; gap: var(--space-6); font-size: var(--text-xs); color: var(--text-tertiary);">
          <span>任务: <strong style="color: var(--text-primary);" x-text="item.completed_tasks + '/' + item.task_count"></strong></span>
          <span x-show="item.health_level" x-text="'健康: ' + healthMap[item.health_level]"></span>
        </div>
      </div>
    </template>
  </div>

  <!-- Empty State -->
  <div class="empty-state" x-show="items.length === 0">
    <div class="empty-state-icon">
      <svg width="48" height="48" viewBox="0 0 20 20" fill="currentColor" opacity="0.3"><path d="M3 4h14v2H3V4zm0 4h14v2H3V8zm0 4h14v2H3v-2zm0 4h14v2H3v-2z"/></svg>
    </div>
    <div class="empty-state-title">暂无项目</div>
    <div class="empty-state-desc">点击"新建项目"创建第一个精益改善项目</div>
  </div>

  <!-- Pagination -->
  <div x-show="pagination.total_pages > 1" class="table-footer" style="margin-top: var(--space-5); border-radius: var(--radius-lg); background: var(--bg-surface); border: 1px solid var(--border-color);">
    <span x-text="'第 ' + pagination.page + ' / ' + pagination.total_pages + ' 页，共 ' + pagination.total + ' 条'"></span>
    <div class="pagination">
      <button class="page-btn" @click="goPage(pagination.page - 1)" :disabled="!pagination.has_prev">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M12 5l-5 5 5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="page-btn" @click="goPage(pagination.page + 1)" :disabled="!pagination.has_next">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M8 5l5 5-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Create Modal -->
<div class="modal-overlay" x-show="showCreateModal" x-cloak @click.self="showCreateModal = false">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">新建项目</h3>
      <button class="modal-close" @click="showCreateModal = false">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">项目名称 <span class="required">*</span></label>
        <input class="form-input" x-model="form.name" placeholder="请输入项目名称">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">项目类型 <span class="required">*</span></label>
          <select class="form-select" x-model="form.project_type">
            <option value="kaizen_event">Kaizen 活动</option>
            <option value="vsm_redux">价值流优化</option>
            <option value="5s_deployment">5S 推广</option>
            <option value="tpm_rollout">TPM 推广</option>
            <option value="training_program">培训项目</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">优先级</label>
          <select class="form-select" x-model="form.priority">
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
            <option value="urgent">紧急</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">开始日期</label>
          <input type="date" class="form-input" x-model="form.start_date">
        </div>
        <div class="form-group">
          <label class="form-label">目标完成日期</label>
          <input type="date" class="form-input" x-model="form.target_end_date">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">项目预算 (¥)</label>
        <input type="number" class="form-input" x-model="form.budget" placeholder="0" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">项目描述</label>
        <textarea class="form-textarea" x-model="form.description" rows="2" placeholder="简要描述项目目标和范围"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" @click="showCreateModal = false">取消</button>
      <button class="btn btn-primary" @click="createProject()">创建项目</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function projectList() {
  return {
    user: LeanOps.user,
    items: [],
    stats: {},
    pagination: { page: 1, total_pages: 1, has_next: false, has_prev: false, total: 0 },
    filter: { search: '', status: '', priority: '', project_type: '' },
    showCreateModal: false,
    searchTimer: null,
    form: { name: '', project_type: 'kaizen_event', priority: 'medium', start_date: '', target_end_date: '', budget: 0, description: '' },
    typeMap: { kaizen_event: 'Kaizen 活动', vsm_redux: '价值流优化', '5s_deployment': '5S 推广', tpm_rollout: 'TPM 推广', training_program: '培训项目' },
    healthMap: { green: '良好', yellow: '关注', orange: '预警', red: '危险' },

    get overdueCount() {
      if (!this.stats.on_hold) return this.stats.on_hold || 0;
      return this.stats.on_hold;
    },

    init() { Promise.all([this.loadData(), this.loadStats()]); },

    async loadData() {
      const params = new URLSearchParams({ page: this.pagination.page, page_size: 20 });
      if (this.filter.status) params.set('status', this.filter.status);
      if (this.filter.search) params.set('search', this.filter.search);
      try {
        const data = await LeanOps.api('/projects?' + params.toString());
        this.items = data.data || [];
        this.pagination = data.pagination || this.pagination;
      } catch (e) { LeanOps.toast('加载项目列表失败', 'error'); }
    },

    async loadStats() {
      try {
        this.stats = await LeanOps.api('/projects/stats');
      } catch (e) { /* silent */ }
    },

    onSearchChange() {
      clearTimeout(this.searchTimer);
      this.searchTimer = setTimeout(() => { this.pagination.page = 1; this.loadData(); }, 300);
    },

    goPage(p) {
      if (p < 1 || p > this.pagination.total_pages) return;
      this.pagination.page = p;
      this.loadData();
    },

    async createProject() {
      if (!this.form.name.trim()) { LeanOps.toast('请输入项目名称', 'warning'); return; }
      try {
        await LeanOps.api('/projects', {
          method: 'POST',
          body: JSON.stringify({
            name: this.form.name,
            project_type: this.form.project_type,
            priority: this.form.priority,
            start_date: this.form.start_date || null,
            target_end_date: this.form.target_end_date || null,
            budget: parseFloat(this.form.budget) || 0,
            description: this.form.description || null,
          }),
        });
        this.showCreateModal = false;
        this.form = { name: '', project_type: 'kaizen_event', priority: 'medium', start_date: '', target_end_date: '', budget: 0, description: '' };
        LeanOps.toast('项目创建成功', 'success');
        await Promise.all([this.loadData(), this.loadStats()]);
      } catch (e) {
        LeanOps.toast(e.detail || '创建失败', 'error');
      }
    },

    fmtMoney(val) {
      if (val === null || val === undefined) return '¥0';
      return '¥' + Number(val).toLocaleString('zh-CN');
    },
  };
}
</script>
{% endblock %}
