{% extends "base.html" %}
{% block page_id %}tpm{% endblock %}
{% block page_title %}TPM设备台账{% endblock %}
{% block content %}
<div x-data="tpmEquipment()" x-init="init()">

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-header-info">
      <h1>TPM设备台账</h1>
      <p>全员生产维护，设备状态一目了然</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-primary" @click="openCreateModal()">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M 2v16m-8-8h16" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        添加设备
      </button>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="stat-grid" x-show="!loading">
    <div class="stat-card">
      <div class="stat-icon primary">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M 3a2 2 0 100 4h12a2 2 0 100-4H4z"/><path fill-rule="evenodd" d="M 8h14v7a2 2 0 01-2 2H5a2 2 0 01-2-2V8zm5 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="stats.total_equipment || 0"></div>
        <div class="stat-label">设备总数</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon success">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="8"/><path d="M 10l2 2 4-4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="stats.normal || 0"></div>
        <div class="stat-label">运行中</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon warning">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M 2a8 8 0 100 16 8 8 0 000-16zm0 2a6 6 0 110 12 6 6 0 010-12zm1 8a1 1 0 01-2 0V9a1 1 0 012 0v3z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="(stats.maintenance || 0) + (stats.overdue_maintenance || 0)"></div>
        <div class="stat-label">维修中</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon danger">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 1.944l-8.66 15h17.32L10 1.944zM10 14a1 1 0 100 2 1 1 0 000-2zm0-8v5a1 1 0 01-2 0V6a1 1 0 012 0z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="stats.fault || 0"></div>
        <div class="stat-label">停机故障</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon accent">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="(stats.avg_oee ?? 0).toFixed(1) + '%'"></div>
        <div class="stat-label">平均OEE</div>
      </div>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="card" style="margin-bottom: var(--space-5);">
    <div class="filter-bar" style="padding: var(--space-4);">
      <div class="search-input" style="flex: 1;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/></svg>
        <input type="text" class="form-input" placeholder="搜索设备名称或编码..." x-model="filter.search" @input.debounce.300ms="loadData()">
      </div>
      <select class="form-select" style="width: 160px;" x-model="filter.equipment_type" @change="loadData()">
        <option value="">全部类型</option>
        <option value="machining">机加工设备</option>
        <option value="precision_machining">精加工设备</option>
        <option value="heat_treatment">热处理炉</option>
        <option value="surface_treatment">表面处理线</option>
        <option value="assembly">装配设备</option>
        <option value="packaging">包装机</option>
      </select>
      <select class="form-select" style="width: 130px;" x-model="filter.status" @change="loadData()">
        <option value="">全部状态</option>
        <option value="normal">运行中</option>
        <option value="maintenance">维修中</option>
        <option value="fault">停机</option>
        <option value="retired">已退役</option>
      </select>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading-spinner" x-show="loading">
    <div class="spinner"></div>
  </div>

  <!-- Equipment Card Grid -->
  <div class="grid-3" x-show="!loading && items.length > 0">
    <template x-for="item in items" :key="item.id">
      <div class="card" style="position: relative;">
        <!-- Status Indicator -->
        <div style="position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 6px;">
          <span class="status-dot" :class="item.status === 'normal' ? 'status-online' : item.status === 'maintenance' ? 'status-away' : 'status-offline'"></span>
          <span style="font-size: var(--text-xs); color: var(--text-tertiary);" x-text="statusLabel(item.status)"></span>
        </div>

        <div style="padding: var(--space-5);">
          <!-- Equipment Info -->
          <div style="margin-bottom: var(--space-3);">
            <h3 style="font-size: var(--text-base); font-weight: 600; color: var(--text-primary); margin-bottom: 2px;" x-text="item.equipment_name"></h3>
            <div style="font-size: var(--text-xs); color: var(--text-tertiary); font-family: var(--font-mono);" x-text="item.equipment_code"></div>
          </div>

          <!-- Type & Location -->
          <div style="display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3);">
            <span class="badge badge-primary" style="font-size: 11px;" x-text="typeLabel(item.equipment_type)"></span>
            <span style="font-size: var(--text-xs); color: var(--text-secondary);" x-text="item.location || '未指定位置'"></span>
          </div>

          <!-- OEE Progress -->
          <div style="margin-bottom: var(--space-3);">
            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
              <span style="font-size: var(--text-xs); color: var(--text-tertiary);">OEE</span>
              <span style="font-size: var(--text-xs); font-weight: 600;" x-text="(item.oee ?? 0).toFixed(1) + '%'" :style="{color: (item.oee ?? 0) >= 85 ? 'var(--color-success)' : (item.oee ?? 0) >= 70 ? 'var(--color-warning)' : 'var(--color-danger)'}"></span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" :style="{width: (item.oee ?? 0) + '%'}" :class="(item.oee ?? 0) >= 85 ? 'bg-success' : (item.oee ?? 0) >= 70 ? 'bg-warning' : 'bg-danger'"></div>
            </div>
          </div>

          <!-- Footer Info -->
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: var(--text-xs);">
            <span style="color: var(--text-tertiary);">
              <template x-if="item.last_maintenance">
                <span>上次保养：<span x-text="LeanOps.fmtDate(item.last_maintenance)" style="color: var(--text-secondary);"></span></span>
              </template>
              <template x-if="!item.last_maintenance">
                <span>暂无保养记录</span>
              </template>
            </span>
            <div style="display: flex; gap: var(--space-2);">
              <template x-if="item.open_faults > 0">
                <span class="badge badge-danger" style="font-size: 10px;" x-text="item.open_faults + ' 故障'"></span>
              </template>
              <a :href="'/tpm/equipment/' + item.id" class="btn btn-secondary btn-sm">详情</a>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Empty State -->
  <div class="empty-state" x-show="!loading && items.length === 0">
    <div class="empty-state-icon">
      <svg width="48" height="48" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 4a2 2 0 012-2h8a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 2h8v8H6V6zm2 2h4v4H8V8z"/></svg>
    </div>
    <div class="empty-state-title">暂无设备</div>
    <div class="empty-state-desc">添加第一台设备，开启TPM管理之旅</div>
  </div>

  <!-- Pagination -->
  <div class="table-footer" x-show="!loading && items.length > 0">
    <span x-text="'共 ' + pagination.total + ' 台设备'"></span>
    <span x-text="'第 ' + pagination.page + ' / ' + pagination.total_pages + ' 页'"></span>
    <div class="pagination">
      <button class="page-btn" :disabled="!pagination.has_prev" @click="changePage(pagination.page - 1)">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/></svg>
      </button>
      <button class="page-btn" :disabled="!pagination.has_next" @click="changePage(pagination.page + 1)">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/></svg>
      </button>
    </div>
  </div>

  <!-- Create Equipment Modal -->
  <div class="modal-overlay" x-show="showCreateModal" x-cloak @click.self="showCreateModal = false">
    <div class="modal" @click.stop>
      <div class="modal-header">
        <h3 class="modal-title">添加设备</h3>
        <button class="btn btn-ghost btn-icon" @click="showCreateModal = false">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">设备编号 <span style="color: var(--color-danger);">*</span></label>
          <input type="text" class="form-input" x-model="form.equipment_code" placeholder="如：CH-001">
        </div>
        <div class="form-group">
          <label class="form-label">设备名称 <span style="color: var(--color-danger);">*</span></label>
          <input type="text" class="form-input" x-model="form.equipment_name" placeholder="请输入设备名称">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">设备类型 <span style="color: var(--color-danger);">*</span></label>
            <select class="form-select" x-model="form.equipment_type">
              <option value="machining">机加工设备</option>
              <option value="precision_machining">精加工设备</option>
              <option value="heat_treatment">热处理炉</option>
              <option value="surface_treatment">表面处理线</option>
              <option value="assembly">装配设备</option>
              <option value="packaging">包装机</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">位置</label>
            <input type="text" class="form-input" x-model="form.location" placeholder="如：A车间">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">制造商</label>
            <input type="text" class="form-input" x-model="form.manufacturer" placeholder="品牌/厂商">
          </div>
          <div class="form-group">
            <label class="form-label">型号</label>
            <input type="text" class="form-input" x-model="form.model" placeholder="设备型号">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" @click="showCreateModal = false">取消</button>
        <button class="btn btn-primary" @click="createEquipment()" :disabled="submitting">
          <span x-show="!submitting">确认添加</span>
          <span x-show="submitting">添加中...</span>
        </button>
      </div>
    </div>
  </div>

</div>
{% endblock %}
{% block scripts %}
<script>
function tpmEquipment() {
  return {
    items: [],
    stats: {},
    loading: false,
    submitting: false,
    showCreateModal: false,
    filter: { search: '', equipment_type: '', status: '' },
    pagination: { page: 1, page_size: 12, total: 0, total_pages: 0, has_next: false, has_prev: false },
    form: { equipment_code: '', equipment_name: '', equipment_type: 'machining', location: '', manufacturer: '', model: '' },

    async init() {
      await Promise.all([this.loadStats(), this.loadData()]);
    },

    async loadStats() {
      try {
        this.stats = await LeanOps.api('/tpm/stats');
      } catch (e) { /* non-critical */ }
    },

    async loadData() {
      this.loading = true;
      try {
        const params = new URLSearchParams({ page: this.pagination.page, page_size: this.pagination.page_size });
        if (this.filter.equipment_type) params.set('equipment_type', this.filter.equipment_type);
        if (this.filter.status) params.set('status', this.filter.status);
        if (this.filter.search) params.set('search', this.filter.search);
        const data = await LeanOps.api('/tpm/equipment?' + params);
        this.items = data.data || [];
        this.pagination = data.pagination || {};
      } catch (e) {
        LeanOps.toast(e.detail || '加载失败', 'error');
      } finally {
        this.loading = false;
      }
    },

    changePage(p) {
      if (p >= 1 && p <= this.pagination.total_pages) {
        this.pagination.page = p;
        this.loadData();
      }
    },

    openCreateModal() {
      this.form = { equipment_code: '', equipment_name: '', equipment_type: 'machining', location: '', manufacturer: '', model: '' };
      this.showCreateModal = true;
    },

    async createEquipment() {
      if (!this.form.equipment_code || !this.form.equipment_name) {
        LeanOps.toast('请填写设备编号和名称', 'warning');
        return;
      }
      this.submitting = true;
      try {
        await LeanOps.api('/tpm/equipment', {
          method: 'POST',
          body: JSON.stringify(this.form),
        });
        this.showCreateModal = false;
        LeanOps.toast('设备添加成功', 'success');
        await Promise.all([this.loadStats(), this.loadData()]);
      } catch (e) {
        LeanOps.toast(e.detail || '添加失败', 'error');
      } finally {
        this.submitting = false;
      }
    },

    statusLabel(s) {
      const map = { normal: '运行中', maintenance: '维修中', fault: '停机', retired: '已退役' };
      return map[s] || s;
    },

    typeLabel(t) {
      const map = { machining: '机加工设备', precision_machining: '精加工设备', heat_treatment: '热处理炉', surface_treatment: '表面处理线', assembly: '装配设备', packaging: '包装机' };
      return map[t] || t;
    },
  };
}
</script>
{% endblock %}
