<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeanOps - 精益运营管理系统</title>
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* ---------- Login Page Specific ---------- */
        .login-page {
            display: flex;
            min-height: 100vh;
            font-family: var(--font-sans);
            background: var(--bg-body);
        }

        /* Left Panel - Brand */
        .login-brand {
            flex: 1;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 40%, #0ea5e9 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--space-12);
            position: relative;
            overflow: hidden;
        }

        .login-brand::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Decorative grid pattern */
        .login-brand::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .brand-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 480px;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-2xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-6);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .brand-logo svg {
            width: 36px;
            height: 36px;
        }

        .brand-title {
            font-size: 2.25rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
            margin-bottom: var(--space-2);
        }

        .brand-subtitle {
            font-size: var(--text-lg);
            color: rgba(255,255,255,0.8);
            font-weight: 400;
            margin-bottom: var(--space-8);
        }

        .brand-features {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            text-align: left;
        }

        .brand-feature {
            display: flex;
            align-items: flex-start;
            gap: var(--space-3);
            color: rgba(255,255,255,0.85);
            font-size: var(--text-sm);
        }

        .brand-feature-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            margin-top: 2px;
            opacity: 0.9;
        }

        /* Decorative circles */
        .decor-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }
        .decor-circle.c1 { width: 300px; height: 300px; top: -100px; right: -80px; }
        .decor-circle.c2 { width: 200px; height: 200px; bottom: 10%; left: -60px; }
        .decor-circle.c3 { width: 150px; height: 150px; top: 40%; right: 10%; border-style: dashed; }

        /* Right Panel - Form */
        .login-form-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--space-12);
            background: var(--bg-body);
        }

        .login-form-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-form-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-2xl);
            padding: var(--space-10);
            box-shadow: var(--shadow-lg);
        }

        .form-header {
            margin-bottom: var(--space-8);
        }

        .form-header h2 {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-1);
        }

        .form-header p {
            font-size: var(--text-sm);
            color: var(--text-tertiary);
        }

        .login-form .form-group {
            margin-bottom: var(--space-5);
        }

        .login-form .form-label {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .login-form .form-input {
            height: 44px;
            font-size: var(--text-base);
            padding: var(--space-2) var(--space-4);
        }

        .login-form .form-input:focus {
            border-color: var(--color-primary-500);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .login-error {
            background: var(--color-danger-50);
            border: 1px solid var(--color-danger-100);
            color: var(--color-danger-700);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
        }

        [data-theme="dark"] .login-error {
            background: rgba(220, 38, 38, 0.1);
            border-color: rgba(220, 38, 38, 0.2);
        }

        .btn-login {
            width: 100%;
            height: 44px;
            font-size: var(--text-base);
            font-weight: 600;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--color-primary-600), var(--color-accent-600));
            border: none;
            color: white;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, var(--color-primary-700), #0284c7);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner-white {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .login-footer {
            margin-top: var(--space-6);
            text-align: center;
            font-size: var(--text-xs);
            color: var(--text-tertiary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-page {
                flex-direction: column;
            }
            .login-brand {
                padding: var(--space-8) var(--space-6);
                min-height: 280px;
            }
            .brand-title {
                font-size: 1.75rem;
            }
            .brand-subtitle {
                font-size: var(--text-base);
            }
            .brand-features {
                display: none;
            }
            .login-form-panel {
                padding: var(--space-6);
            }
            .login-form-card {
                padding: var(--space-6);
                box-shadow: none;
                border: none;
                background: transparent;
            }
            .decor-circle { display: none; }
        }
    </style>
</head>
<body x-data="loginApp()" :data-theme="theme">
    <div class="login-page">

        <!-- Left: Brand Panel -->
        <div class="login-brand">
            <div class="decor-circle c1"></div>
            <div class="decor-circle c2"></div>
            <div class="decor-circle c3"></div>

            <!-- Decorative SVG: Lean cycle illustration -->
            <svg style="position: absolute; top: 8%; left: 10%; opacity: 0.06; pointer-events: none;" width="160" height="160" viewBox="0 0 160 160">
                <path d="M 20 L110 50 L100 80 L80 60 L60 80 L50 50 Z" fill="white"/>
                <polygon points="80,140 50,110 60,80 80,100 100,80 110,110" fill="white" opacity="0.6"/>
                <circle cx="80" cy="80" r="12" fill="none" stroke="white" stroke-width="3"/>
                <path d="M 68 L80 80 L90 88" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>

            <svg style="position: absolute; bottom: 12%; right: 8%; opacity: 0.06; pointer-events: none;" width="120" height="120" viewBox="0 0 120 120">
                <rect x="20" y="30" width="80" height="60" rx="4" fill="none" stroke="white" stroke-width="2.5"/>
                <line x1="35" y1="45" x2="85" y2="45" stroke="white" stroke-width="2"/>
                <line x1="35" y1="55" x2="75" y2="55" stroke="white" stroke-width="2"/>
                <line x1="35" y1="65" x2="65" y2="65" stroke="white" stroke-width="2"/>
                <line x1="35" y1="75" x2="55" y2="75" stroke="white" stroke-width="2"/>
            </svg>

            <div class="brand-content">
                <div class="brand-logo">
                    <svg viewBox="0 0 36 36" fill="none">
                        <rect x="2" y="4" width="14" height="14" rx="3" fill="white" opacity="0.9"/>
                        <rect x="20" y="4" width="14" height="14" rx="3" fill="white" opacity="0.6"/>
                        <rect x="2" y="20" width="14" height="12" rx="3" fill="white" opacity="0.6"/>
                        <rect x="20" y="20" width="14" height="12" rx="3" fill="white" opacity="0.9"/>
                    </svg>
                </div>
                <h1 class="brand-title">LeanOps</h1>
                <p class="brand-subtitle">精益运营管理系统</p>

                <div class="brand-features">
                    <div class="brand-feature">
                        <svg class="brand-feature-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3l-4 4a1 1 0 01-1.4 0l-2-2a1 1 0 011.4-1.4L9 10.6l3.3-3.3a1 1 0 011.4 1.4z" clip-rule="evenodd"/>
                        </svg>
                        <span>持续改善提案管理，驱动全员参与精益文化</span>
                    </div>
                    <div class="brand-feature">
                        <svg class="brand-feature-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3l-4 4a1 1 0 01-1.4 0l-2-2a1 1 0 011.4-1.4L9 10.6l3.3-3.3a1 1 0 011.4 1.4z" clip-rule="evenodd"/>
                        </svg>
                        <span>5S 现场审核与评分，标准化现场管理体系</span>
                    </div>
                    <div class="brand-feature">
                        <svg class="brand-feature-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3l-4 4a1 1 0 01-1.4 0l-2-2a1 1 0 011.4-1.4L9 10.6l3.3-3.3a1 1 0 011.4 1.4z" clip-rule="evenodd"/>
                        </svg>
                        <span>TPM 设备全生命周期管理与故障追踪</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Login Form -->
        <div class="login-form-panel">
            <div class="login-form-wrapper">
                <div class="login-form-card">
                    <div class="form-header">
                        <h2>欢迎回来</h2>
                        <p>登录您的账户以继续</p>
                    </div>

                    <form class="login-form" @submit.prevent="handleLogin()">
                        <!-- Error Message -->
                        <div class="login-error" x-show="error" x-text="error"></div>

                        <!-- Username -->
                        <div class="form-group">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-input" x-model="form.username"
                                placeholder="请输入用户名" autocomplete="username" required>
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-input" x-model="form.password"
                                placeholder="请输入密码" autocomplete="current-password" required>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn-login" :disabled="loading">
                            <span x-show="!loading">登 录</span>
                            <span x-show="loading" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <span class="spinner-white"></span> 登录中...
                            </span>
                        </button>
                    </form>
                </div>

                <div class="login-footer">
                    &copy; 2026 LeanOps. All rights reserved.
                </div>
            </div>
        </div>

    </div>

    <script src="/static/js/app.js"></script>
    <script>
    function loginApp() {
        return {
            form: { username: '', password: '' },
            error: '',
            loading: false,
            theme: localStorage.getItem('leanops_theme') || 'light',

            init() {
                LeanOps.initTheme();
                this.theme = document.documentElement.getAttribute('data-theme') || 'light';
            },

            async handleLogin() {
                this.loading = true;
                this.error = '';
                try {
                    const res = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.form),
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        this.error = data.detail || '登录失败，请检查用户名和密码';
                        return;
                    }
                    localStorage.setItem('leanops_token', data.token);
                    localStorage.setItem('leanops_user', JSON.stringify(data.user));
                    localStorage.setItem('leanops_factory', JSON.stringify(data.factory));
                    window.location.href = '/dashboard';
                } catch (e) {
                    this.error = '网络错误，无法连接服务器，请稍后重试';
                } finally {
                    this.loading = false;
                }
            }
        };
    }
    </script>
</body>
</html>
