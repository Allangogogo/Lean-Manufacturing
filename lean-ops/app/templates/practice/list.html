{% extends "base.html" %}
{% block page_id %}practices{% endblock %}
{% block page_title %}最佳实践库{% endblock %}
{% block content %}
<div x-data="practiceList()" x-init="init()">

  <div class="page-header">
    <div class="page-header-info">
      <h1>最佳实践库</h1>
      <p>共享精益改善智慧，让好方法在全组织流动</p>
    </div>
    <div class="page-header-actions">
      <a href="/practices/new" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M 2v16m-8-8h16" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        提交实践
      </a>
    </div>
  </div>

  <div class="card" style="margin-bottom: var(--space-6);">
    <div class="filter-bar">
      <div class="search-input" style="flex: 1;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/></svg>
        <input type="text" class="form-input" placeholder="搜索实践..." x-model="filter.keyword" @input.debounce.300ms="loadData()">
      </div>
      <select class="form-select" style="width: auto;" x-model="filter.category" @change="loadData()">
        <option value="">全部分类</option>
        <option value="tool">宸ュ叿</option>
        <option value="method">方法</option>
        <option value="mindset">思维</option>
        <option value="process">娴佺▼</option>
      </select>
      <select class="form-select" style="width: auto;" x-model="filter.sort" @change="loadData()">
        <option value="newest">最新</option>
        <option value="popular">最热</option>
        <option value="saving">最高节省</option>
      </select>
      <select class="form-select" style="width: auto;" x-model="filter.status" @change="loadData()">
        <option value="">全部状态</option>
        <option value="draft">草稿</option>
        <option value="published">已发布</option>
      </select>
    </div>
  </div>

  <div class="loading-spinner" x-show="loading"><div class="spinner"></div></div>

  <div class="grid-3" x-show="!loading && items.length > 0">
    <template x-for="item in items" :key="item.id">
      <a :href="'/practices/' + item.id" class="card" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; cursor: pointer;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--space-2);">
          <span class="badge" :class="categoryClass(item.category)" x-text="categoryLabel(item.category)"></span>
          <span class="badge" :class="diffClass(item.difficulty_level)" x-text="diffLabel(item.difficulty_level)"></span>
        </div>
        <h3 style="font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-2); color: var(--text-primary);" x-text="item.title"></h3>
        <p style="font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" x-text="item.subcategory || '--'"></p>
        <div style="display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-3);" x-show="item.tags">
          <template x-for="tag in parseTags(item.tags)" :key="tag">
            <span class="badge badge-outline" x-text="tag" style="font-size: 10px;"></span>
          </template>
        </div>
        <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: var(--space-3); border-top: 1px solid var(--border-color);">
          <div style="display: flex; align-items: center; gap: var(--space-2);">
            <div class="avatar avatar-sm" style="background: var(--color-primary-100); color: var(--color-primary-700);" x-text="item.author_name ? item.author_name.charAt(0) : '?'"></div>
            <div>
              <div style="font-size: var(--text-xs); font-weight: 500;" x-text="item.author_name || '--'"></div>
              <div style="font-size: 10px; color: var(--text-tertiary);" x-text="LeanOps.fmtDate(item.created_at)"></div>
            </div>
          </div>
          <div style="display: flex; gap: var(--space-3); align-items: center;">
            <span style="display: flex; align-items: center; gap: 2px; font-size: var(--text-xs); color: var(--text-tertiary);">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z"/></svg>
              <span x-text="item.like_count || 0"></span>
            </span>
            <span style="display: flex; align-items: center; gap: 2px; font-size: var(--text-xs); color: var(--text-tertiary);">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z"/></svg>
              <span x-text="item.comment_count || 0"></span>
            </span>
          </div>
        </div>
      </a>
    </template>
  </div>

  <div class="empty-state" x-show="!loading && items.length === 0">
    <div class="empty-state-icon"><svg width="48" height="48" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg></div>
    <div class="empty-state-title">暂无最佳实践</div>
    <div class="empty-state-desc">提交第一个最佳实践，分享你的改善经验</div>
  </div>

  <div style="margin-top: var(--space-6);" x-show="!loading && items.length > 0">
    <div style="display: flex; align-items: center; justify-content: center; gap: var(--space-2);">
      <button class="page-btn" :disabled="!pagination.has_prev" @click="changePage(pagination.page - 1)">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/></svg>
      </button>
      <span style="font-size: var(--text-sm); color: var(--text-secondary);" x-text="pagination.page + ' / ' + pagination.total_pages"></span>
      <button class="page-btn" :disabled="!pagination.has_next" @click="changePage(pagination.page + 1)">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/></svg>
      </button>
    </div>
  </div>

</div>
{% endblock %}
{% block scripts %}
<script>
function practiceList() {
  return {
    items: [], loading: false,
    filter: { keyword: '', category: '', sort: 'newest', status: '' },
    pagination: { page: 1, page_size: 20, total: 0, total_pages: 0, has_next: false, has_prev: false },
    async init() { await this.loadData(); },
    async loadData() {
      this.loading = true;
      try {
        const params = new URLSearchParams({ page: this.pagination.page, page_size: this.pagination.page_size });
        if (this.filter.keyword) params.set('keyword', this.filter.keyword);
        if (this.filter.category) params.set('category', this.filter.category);
        if (this.filter.sort) params.set('sort_by', this.filter.sort);
        if (this.filter.status) params.set('status', this.filter.status);
        const data = await LeanOps.api('/practices?' + params);
        this.items = data.data || [];
        this.pagination = data.pagination || {};
      } catch (e) {
        LeanOps.toast(e.detail || '加载失败', 'error');
      } finally { this.loading = false; }
    },
    changePage(p) { if (p >= 1) { this.pagination.page = p; this.loadData(); } },
    categoryClass(c) {
      const m = { tool: 'badge-primary', method: 'badge-success', mindset: 'badge-warning', process: 'badge-info' };
      return m[c] || 'badge-gray';
    },
    categoryLabel(c) {
      const m = { tool: '宸ュ叿', method: '方法', mindset: '思维', process: '娴佺▼' };
      return m[c] || c;
    },
    diffClass(d) {
      const m = { easy: 'badge-success', medium: 'badge-warning', hard: 'badge-danger' };
      return m[d] || 'badge-gray';
    },
    diffLabel(d) {
      const m = { easy: '简单, medium: '中等', hard: '困难' };
      return m[d] || d;
    },
    parseTags(tags) {
      try {
        const t = typeof tags === 'string' ? JSON.parse(tags) : tags;
        return Array.isArray(t) ? t.slice(0, 4) : [];
      } catch (e) { return []; }
    },
  };
}
</script>
{% endblock %}
