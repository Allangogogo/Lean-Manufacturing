{% extends "base.html" %}
{% block page_id %}kaizen{% endblock %}
{% block page_title %}改善提案{% endblock %}
{% block content %}
<div x-data="kaizenList()" x-init="init()">

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-header-info">
      <h1>改善提案</h1>
      <p>全面持续改善，积小胜为大胜</p>
    </div>
    <div class="page-header-actions">
      <a href="/kaizen/create" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M 2v16m-8-8h16" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        新建提案
      </a>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="stat-grid" x-show="!loading">
    <div class="stat-card">
      <div class="stat-icon primary">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 011 1v5H4V7zm0 7h12v2a1 1 0 01-1 1H5a1 1 0 01-1-1v-2z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="stats.total || 0"></div>
        <div class="stat-label">总提案</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon warning">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M 2a8 8 0 100 16 8 8 0 000-16zm0 2a6 6 0 110 12 6 6 0 010-12zm1 8a1 1 0 01-2 0V9a1 1 0 012 0v3z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="(stats.reviewing || 0) + (stats.submitted || 0)"></div>
        <div class="stat-label">审核中</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon success">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="stats.verified || 0"></div>
        <div class="stat-label">已验证</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon accent">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z"/><path fill-rule="evenodd" d="M 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.076-2.354-1.253V5z"/></svg>
      </div>
      <div class="stat-content">
        <div class="stat-value" x-text="stats.total_saving != null ? LeanOps.fmtMoney(stats.total_saving) : '¥0'"></div>
        <div class="stat-label">累计节约</div>
      </div>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="table-container">
    <div class="table-header">
      <div class="table-title">提案列表 <span class="text-tertiary" style="font-size: var(--text-xs); font-weight: 400;" x-text="'共 ' + pagination.total + ' 条'"></span></div>
      <div class="table-actions filter-bar">
        <div class="search-input">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/></svg>
          <input type="text" class="form-input" placeholder="搜索提案..." x-model="filter.search" @input.debounce.300ms="loadData()">
        </div>
        <select class="form-select" style="width: auto;" x-model="filter.status" @change="loadData()">
          <option value="">全部状态</option>
          <option value="draft">草稿</option>
          <option value="submitted">已提交</option>
          <option value="reviewing">审核中</option>
          <option value="approved">已批准</option>
          <option value="implementing">实施中</option>
          <option value="verified">已验证</option>
          <option value="closed">已关闭</option>
          <option value="rejected">已拒绝</option>
        </select>
        <select class="form-select" style="width: auto;" x-model="filter.category" @change="loadData()">
          <option value="">全部分类</option>
          <option value="quality">质量</option>
          <option value="cost">成本</option>
          <option value="delivery">交期</option>
          <option value="safety">安全</option>
          <option value="morale">士气</option>
          <option value="environment">环保</option>
        </select>
        <select class="form-select" style="width: auto;" x-model="filter.priority" @change="loadData()">
          <option value="">全部优先级</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
          <option value="urgent">紧急</option>
        </select>
      </div>
    </div>

    <!-- Loading -->
    <div class="loading-spinner" x-show="loading">
      <div class="spinner"></div>
    </div>

    <!-- Table -->
    <table class="data-table" x-show="!loading && items.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>提案标题</th>
          <th>分类</th>
          <th>提交人</th>
          <th>状态</th>
          <th>优先级</th>
          <th>预期节约</th>
          <th>提交日期</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="item in items" :key="item.id">
          <tr>
            <td style="color: var(--text-tertiary); font-size: var(--text-xs);" x-text="'#' + item.id"></td>
            <td>
              <a :href="'/kaizen/' + item.id" style="color: var(--color-primary-600); font-weight: 500; text-decoration: none;" x-text="item.title"></a>
            </td>
            <td x-html="categoryBadge(item.category)"></td>
            <td x-text="item.submitter_name || '-'"></td>
            <td x-html="LeanOps.statusBadge(item.status, {draft:{label:'草稿',class:'badge-gray'},submitted:{label:'已提交',class:'badge-info'},reviewing:{label:'审核中',class:'badge-warning'},approved:{label:'已批准',class:'badge-success'},implementing:{label:'实施中',class:'badge-primary'},verified:{label:'已验证',class:'badge-success'},closed:{label:'已关闭',class:'badge-gray'},rejected:{label:'已拒绝',class:'badge-danger'},returned:{label:'已退回',class:'badge-warning'}})"></td>
            <td x-html="LeanOps.priorityBadge(item.priority)"></td>
            <td x-text="item.expected_saving ? LeanOps.fmtMoney(item.expected_saving) : '-'"></td>
            <td x-text="LeanOps.fmtDate(item.created_at)"></td>
            <td>
              <a :href="'/kaizen/' + item.id" class="btn btn-secondary btn-sm">查看</a>
            </td>
          </tr>
        </template>
      </tbody>
    </table>

    <!-- Empty State -->
    <div class="empty-state" x-show="!loading && items.length === 0">
      <div class="empty-state-icon">
        <svg width="48" height="48" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z"/></svg>
      </div>
      <div class="empty-state-title">暂无改善提案</div>
      <div class="empty-state-desc">创建你的第一个改善提案，开启精益之旅</div>
    </div>

    <!-- Pagination -->
    <div class="table-footer" x-show="!loading && items.length > 0">
      <span x-text="'第 ' + pagination.page + ' / ' + pagination.total_pages + ' 页'"></span>
      <div class="pagination">
        <button class="page-btn" :disabled="!pagination.has_prev" @click="changePage(pagination.page - 1)">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/></svg>
        </button>
        <button class="page-btn" :disabled="!pagination.has_next" @click="changePage(pagination.page + 1)">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>
{% endblock %}
{% block scripts %}
<script>
function kaizenList() {
  return {
    items: [],
    stats: {},
    loading: false,
    filter: { search: '', status: '', category: '', priority: '' },
    pagination: { page: 1, page_size: 20, total: 0, total_pages: 0, has_next: false, has_prev: false },
    async init() {
      await Promise.all([this.loadStats(), this.loadData()]);
    },
    async loadStats() {
      try {
        this.stats = await LeanOps.api('/kaizen/stats');
      } catch (e) { /* stats load fail is non-critical */ }
    },
    async loadData() {
      this.loading = true;
      try {
        const params = new URLSearchParams({ page: this.pagination.page, page_size: this.pagination.page_size });
        if (this.filter.status) params.set('status', this.filter.status);
        if (this.filter.category) params.set('category', this.filter.category);
        if (this.filter.search) params.set('search', this.filter.search);
        const data = await LeanOps.api('/kaizen?' + params);
        this.items = data.data || [];
        this.pagination = data.pagination || {};
      } catch (e) {
        LeanOps.toast(e.detail || '加载失败', 'error');
      } finally {
        this.loading = false;
      }
    },
    changePage(p) { if (p >= 1) { this.pagination.page = p; this.loadData(); } },
    categoryBadge(c) {
      const map = { quality: { label: '质量', class: 'badge-primary' }, cost: { label: '成本', class: 'badge-success' }, delivery: { label: '交期', class: 'badge-warning' }, safety: { label: '安全', class: 'badge-danger' }, morale: { label: '士气', class: 'badge-info' }, environment: { label: '环保', class: 'badge-gray' } };
      const item = map[c] || { label: c, class: 'badge-gray' };
      return '<span class="badge ' + item.class + '">' + item.label + '</span>';
    },
  };
}
</script>
{% endblock %}
