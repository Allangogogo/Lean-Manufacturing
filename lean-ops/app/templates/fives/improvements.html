{% extends "base.html" %}
{% block page_id %}fives{% endblock %}
{% block page_title %}5S改善跟踪{% endblock %}
{% block content %}
<div x-data="improvementsPage()" x-init="init()">

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-header-info">
      <h1>5S 改善跟踪</h1>
      <p x-text="'共 ' + pagination.total + ' 个改善项'"></p>
    </div>
    <div class="page-header-actions">
      <a href="/fives" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"/></svg>
        返回审核
      </a>
    </div>
  </div>

  <div class="loading-spinner" x-show="loading"><div class="spinner"></div></div>

  <!-- Kanban Board -->
  <div x-show="!loading" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); align-items: start;">

    <!-- Column: Open -->
    <div>
      <div style="padding: var(--space-3) var(--space-4); background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: 3px solid var(--color-warning-500);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: var(--space-2);">
            <div style="width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-warning-500);"></div>
            <span style="font-size: var(--text-sm); font-weight: 600; color: var(--text-primary);">待处理</span>
          </div>
          <span class="badge badge-warning" x-text="openCount"></span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3) 0;">
        <template x-for="item in openItems" :key="item.id">
          <div class="card" style="padding: var(--space-4);">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2);">
              <a :href="'/fives/audit/' + item.audit_id" style="font-size: var(--text-xs); color: var(--color-primary-600); text-decoration: none;" x-text="'#审核' + item.audit_id"></a>
              <span x-show="item.due_date" style="font-size: var(--text-xs); color: var(--text-tertiary);" x-text="LeanOps.fmtDate(item.due_date)"></span>
            </div>
            <div style="font-size: var(--text-sm); font-weight: 500; color: var(--text-primary); margin-bottom: var(--space-2); line-height: 1.5;" x-text="item.item_description"></div>
            <div style="display: flex; align-items: center; justify-content: space-between; font-size: var(--text-xs); color: var(--text-tertiary);">
              <div style="display: flex; align-items: center; gap: var(--space-2);">
                <div class="avatar avatar-sm" style="background: var(--color-primary-100); color: var(--color-primary-700);" x-text="LeanOps.initials(item.assigned_to_name)"></div>
                <span x-text="item.assigned_to_name || '未分配'"></span>
              </div>
              <div style="display: flex; gap: var(--space-1);">
                <button class="btn btn-sm btn-primary" @click="updateStatus(item.id, 'in_progress')" style="font-size: 11px;">开始处理</button>
              </div>
            </div>
          </div>
        </template>
        <div x-show="openItems.length === 0" style="text-align: center; padding: var(--space-6); color: var(--text-tertiary); font-size: var(--text-sm);">
          <svg width="32" height="32" viewBox="0 0 20 20" fill="currentColor" style="opacity: 0.3; margin-bottom: var(--space-2);"><path fill-rule="evenodd" d="M 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/></svg>
          <div>无待处理项</div>
        </div>
      </div>
    </div>

    <!-- Column: In Progress -->
    <div>
      <div style="padding: var(--space-3) var(--space-4); background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: 3px solid var(--color-primary-500);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: var(--space-2);">
            <div style="width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-primary-500);"></div>
            <span style="font-size: var(--text-sm); font-weight: 600; color: var(--text-primary);">处理中</span>
          </div>
          <span class="badge badge-primary" x-text="progressCount"></span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3) 0;">
        <template x-for="item in progressItems" :key="item.id">
          <div class="card" style="padding: var(--space-4);">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2);">
              <a :href="'/fives/audit/' + item.audit_id" style="font-size: var(--text-xs); color: var(--color-primary-600); text-decoration: none;" x-text="'#审核' + item.audit_id"></a>
              <span x-show="item.due_date" style="font-size: var(--text-xs); color: var(--text-tertiary);" x-text="LeanOps.fmtDate(item.due_date)"></span>
            </div>
            <div style="font-size: var(--text-sm); font-weight: 500; color: var(--text-primary); margin-bottom: var(--space-2); line-height: 1.5;" x-text="item.item_description"></div>
            <div style="display: flex; align-items: center; justify-content: space-between; font-size: var(--text-xs); color: var(--text-tertiary);">
              <div style="display: flex; align-items: center; gap: var(--space-2);">
                <div class="avatar avatar-sm" style="background: var(--color-primary-100); color: var(--color-primary-700);" x-text="LeanOps.initials(item.assigned_to_name)"></div>
                <span x-text="item.assigned_to_name || '未分配'"></span>
              </div>
              <div style="display: flex; gap: var(--space-1);">
                <button class="btn btn-sm btn-success" @click="updateStatus(item.id, 'completed')" style="font-size: 11px;">完成</button>
              </div>
            </div>
          </div>
        </template>
        <div x-show="progressItems.length === 0" style="text-align: center; padding: var(--space-6); color: var(--text-tertiary); font-size: var(--text-sm);">
          <svg width="32" height="32" viewBox="0 0 20 20" fill="currentColor" style="opacity: 0.3; margin-bottom: var(--space-2);"><path d="M 2a8 8 0 100 16 8 8 0 000-16zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
          <div>无进行中项</div>
        </div>
      </div>
    </div>

    <!-- Column: Completed -->
    <div>
      <div style="padding: var(--space-3) var(--space-4); background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: 3px solid var(--color-success-500);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: var(--space-2);">
            <div style="width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-success-500);"></div>
            <span style="font-size: var(--text-sm); font-weight: 600; color: var(--text-primary);">已完成</span>
          </div>
          <span class="badge badge-success" x-text="doneCount"></span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3) 0;">
        <template x-for="item in doneItems" :key="item.id">
          <div class="card" style="padding: var(--space-4); opacity: 0.8;">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2);">
              <a :href="'/fives/audit/' + item.audit_id" style="font-size: var(--text-xs); color: var(--color-success-600); text-decoration: none;" x-text="'#审核' + item.audit_id"></a>
              <span x-show="item.completed_date" style="font-size: var(--text-xs); color: var(--text-tertiary);" x-text="LeanOps.fmtDate(item.completed_date)"></span>
            </div>
            <div style="font-size: var(--text-sm); font-weight: 500; color: var(--text-primary); margin-bottom: var(--space-2); line-height: 1.5;" x-text="item.item_description"></div>
            <div style="display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--text-tertiary);">
              <div class="avatar avatar-sm" style="background: var(--color-success-100); color: var(--color-success-700);" x-text="LeanOps.initials(item.assigned_to_name)"></div>
              <span x-text="item.assigned_to_name || '未分配'"></span>
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor" style="color: var(--color-success-500);"><path fill-rule="evenodd" d="M 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
            </div>
          </div>
        </template>
        <div x-show="doneItems.length === 0" style="text-align: center; padding: var(--space-6); color: var(--text-tertiary); font-size: var(--text-sm);">
          <svg width="32" height="32" viewBox="0 0 20 20" fill="currentColor" style="opacity: 0.3; margin-bottom: var(--space-2);"><path fill-rule="evenodd" d="M 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>
          <div>无已完成项</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Pagination (bottom) -->
  <div x-show="!loading" style="display: flex; justify-content: center; margin-top: var(--space-6); gap: var(--space-2);">
    <button class="btn btn-secondary btn-sm" :disabled="!pagination.has_prev" @click="goPage(pagination.page - 1)">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/></svg>
      上一页
    </button>
    <span style="display: flex; align-items: center; font-size: var(--text-sm); color: var(--text-tertiary); padding: 0 var(--space-2);" x-text="'第 ' + pagination.page + ' / ' + pagination.total_pages + ' 页'"></span>
    <button class="btn btn-secondary btn-sm" :disabled="!pagination.has_next" @click="goPage(pagination.page + 1)">
      下一页
      <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/></svg>
    </button>
  </div>

</div>
{% endblock %}
{% block scripts %}
<script>
function improvementsPage() {
  return {
    allItems: [],
    loading: true,
    pagination: { page: 1, total_pages: 1, has_next: false, has_prev: false, total: 0 },

    get openItems() { return this.allItems.filter(i => i.status === 'open'); },
    get progressItems() { return this.allItems.filter(i => i.status === 'in_progress'); },
    get doneItems() { return this.allItems.filter(i => i.status === 'completed'); },
    get openCount() { return this.openItems.length; },
    get progressCount() { return this.progressItems.length; },
    get doneCount() { return this.doneItems.length; },

    async init() { await this.loadData(); },

    async loadData() {
      this.loading = true;
      try {
        const p = new URLSearchParams({ page: this.pagination.page, page_size: 50 });
        const data = await LeanOps.api('/fives/improvements?' + p);
        this.allItems = data.data || [];
        this.pagination = data.pagination || {};
      } catch (e) {
        LeanOps.toast(e.detail || '加载失败', 'error');
      } finally { this.loading = false; }
    },

    goPage(p) {
      if (p < 1 || p > this.pagination.total_pages) return;
      this.pagination.page = p; this.loadData();
    },

    async updateStatus(id, status) {
      try {
        await LeanOps.api('/fives/improvements/' + id, {
          method: 'PUT',
          body: JSON.stringify({ status }),
        });
        await this.loadData();
        LeanOps.toast('状态已更新', 'success');
      } catch (e) {
        LeanOps.toast(e.detail || '更新失败', 'error');
      }
    },
  };
}
</script>
{% endblock %}
