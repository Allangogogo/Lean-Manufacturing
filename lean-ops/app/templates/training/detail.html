{% extends "base.html" %}
{% block page_id %}training{% endblock %}
{% block page_title %}培训详情{% endblock %}
{% block content %}
<div x-data="trainingDetail()" x-init="init()">

  <!-- Loading -->
  <div class="loading-spinner" x-show="loading">
    <div class="spinner"></div>
  </div>

  <!-- Back link -->
  <div style="margin-bottom: var(--space-4);" x-show="!loading">
    <a href="/training" class="btn btn-ghost btn-sm" style="padding-left: 0;">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"/></svg>
      返回培训列表
    </a>
  </div>

  <template x-if="!loading && session">

    <!-- Training Info Card -->
    <div class="card" style="margin-bottom: var(--space-5);">
      <div style="padding: var(--space-6);">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-4); margin-bottom: var(--space-4);">
          <div style="flex: 1; min-width: 0;">
            <h1 style="font-size: var(--text-2xl); font-weight: 700; color: var(--text-primary); margin-bottom: var(--space-2);" x-text="session.title"></h1>
            <p style="color: var(--text-secondary); font-size: var(--text-sm);" x-text="session.description || '暂无描述'"></p>
          </div>
          <div style="display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0;">
            <span class="badge" :class="statusBadgeClass(session.status)" style="font-size: var(--text-sm); padding: 6px 14px;" x-text="statusLabel(session.status)"></span>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-4);">
          <div style="display: flex; align-items: center; gap: var(--space-3);">
            <div style="width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-primary-50); display: flex; align-items: center; justify-content: center; color: var(--color-primary-600); flex-shrink: 0;">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg>
            </div>
            <div style="min-width: 0;">
              <div style="font-size: var(--text-xs); color: var(--text-tertiary);">讲师</div>
              <div style="font-size: var(--text-sm); font-weight: 500; color: var(--text-primary);" x-text="session.trainer_name"></div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: var(--space-3);">
            <div style="width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-success-50); display: flex; align-items: center; justify-content: center; color: var(--color-success-600); flex-shrink: 0;">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm-2 5a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1z"/></svg>
            </div>
            <div style="min-width: 0;">
              <div style="font-size: var(--text-xs); color: var(--text-tertiary);">日期</div>
              <div style="font-size: var(--text-sm); font-weight: 500; color: var(--text-primary);" x-text="LeanOps.fmtDate(session.scheduled_date)"></div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: var(--space-3);">
            <div style="width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-warning-50); display: flex; align-items: center; justify-content: center; color: var(--color-warning-600); flex-shrink: 0;">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"/></svg>
            </div>
            <div style="min-width: 0;">
              <div style="font-size: var(--text-xs); color: var(--text-tertiary);">时长</div>
              <div style="font-size: var(--text-sm); font-weight: 500; color: var(--text-primary);" x-text="session.duration_hours + ' 小时'"></div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: var(--space-3);">
            <div style="width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-info-50); display: flex; align-items: center; justify-content: center; color: var(--color-info); flex-shrink: 0;">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"/></svg>
            </div>
            <div style="min-width: 0;">
              <div style="font-size: var(--text-xs); color: var(--text-tertiary);">地点</div>
              <div style="font-size: var(--text-sm); font-weight: 500; color: var(--text-primary);" x-text="session.location || '未指定'"></div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: var(--space-3);">
            <div style="width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-primary-50); display: flex; align-items: center; justify-content: center; color: var(--color-primary-600); flex-shrink: 0;">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v1h8v-1zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-1a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v1h-3zM4.75 14.094A5.973 5.973 0 004 17v1H1v-1a3 3 0 013.75-2.906z"/></svg>
            </div>
            <div style="min-width: 0;">
              <div style="font-size: var(--text-xs); color: var(--text-tertiary);">报名情况</div>
              <div style="font-size: var(--text-sm); font-weight: 500; color: var(--text-primary);" x-text="session.enrolled_count + ' / ' + session.max_participants"></div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div style="margin-top: var(--space-5); padding-top: var(--space-4); border-top: 1px solid var(--border-color); display: flex; gap: var(--space-2); flex-wrap: wrap;">
          <template x-if="session.status === 'scheduled'">
            <button class="btn btn-success" @click="startSession()">开始培训</button>
          </template>
          <template x-if="session.status === 'in_progress'">
            <button class="btn btn-success" @click="completeSession()">完成培训</button>
          </template>
          <template x-if="session.status === 'scheduled' && session.enrolled_count < session.max_participants">
            <button class="btn btn-primary" @click="enrollSelf()">我要报名</button>
          </template>
        </div>
      </div>
    </div>

    <!-- Enrollment Table -->
    <div class="table-container" style="margin-bottom: var(--space-5);">
      <div class="table-header">
        <div class="table-title">参训人员 <span style="font-size: var(--text-xs); font-weight: 400; color: var(--text-tertiary);" x-text="'共 ' + (session.enrollments ? session.enrollments.length : 0) + ' 人'"></span></div>
        <div class="table-actions">
          <template x-if="session.status === 'in_progress'">
            <select class="form-select" style="width: 120px;" x-model="enrollFilter.status">
              <option value="">全部状态</option>
              <option value="enrolled">已报名</option>
              <option value="attended">已签到</option>
              <option value="certified">已认证</option>
            </select>
          </template>
        </div>
      </div>
      <table class="data-table" x-show="session.enrollments && session.enrollments.length > 0">
        <thead>
          <tr>
            <th>姓名</th>
            <th>状态</th>
            <th>成绩</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="e in filteredEnrollments()" :key="e.id">
            <tr>
              <td style="font-weight: 500;" x-text="e.user_name"></td>
              <td x-html="enrollStatusBadge(e.status)"></td>
              <td>
                <span x-show="e.score != null" x-text="e.score" style="font-weight: 600;"></span>
                <span x-show="e.score == null" style="color: var(--text-tertiary);">--</span>
              </td>
              <td>
                <div style="display: flex; gap: var(--space-1);">
                  <template x-if="session.status === 'in_progress' && e.status === 'enrolled'">
                    <div style="display: flex; align-items: center; gap: 4px;">
                      <input type="number" x-model.number="e._score" placeholder="分数" class="form-input" style="width: 70px; padding: 2px 6px; font-size: 12px;">
                      <button @click="attendStudent(e.user_id, e._score)" class="btn btn-primary btn-sm">签到</button>
                    </div>
                  </template>
                  <template x-if="session.status === 'in_progress' && e.status === 'attended'">
                    <button @click="certifyStudent(e.user_id)" class="btn btn-success btn-sm">认证</button>
                  </template>
                  <template x-if="session.status === 'scheduled' && e.status === 'enrolled'">
                    <button @click="cancelEnrollment(e.user_id)" class="btn btn-ghost btn-sm" style="color: var(--color-danger);">取消</button>
                  </template>
                  <template x-if="e.status === 'certified'">
                    <span style="color: var(--text-tertiary); font-size: var(--text-xs);">已认证</span>
                  </template>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      <div class="empty-state" x-show="!session.enrollments || session.enrollments.length === 0">
        <div class="empty-state-icon">
          <svg width="48" height="48" viewBox="0 0 20 20" fill="currentColor"><path d="M 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg>
        </div>
        <div class="empty-state-title">暂无参训人员</div>
        <div class="empty-state-desc">还没有人报名参加此培训</div>
      </div>
    </div>

    <!-- Materials Section -->
    <div class="table-container" style="margin-bottom: var(--space-5);">
      <div class="table-header">
        <div class="table-title">课程材料 <span style="font-size: var(--text-xs); font-weight: 400; color: var(--text-tertiary);" x-text="'共 ' + (session.materials ? session.materials.length : 0) + ' 个'"></span></div>
      </div>
      <table class="data-table" x-show="session.materials && session.materials.length > 0">
        <thead>
          <tr>
            <th>材料名称</th>
            <th>类型</th>
            <th>大小</th>
            <th>上传时间</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="m in session.materials" :key="m.id">
            <tr>
              <td style="font-weight: 500;" x-text="m.material_name"></td>
              <td>
                <span class="badge" :class="materialTypeBadge(m.material_type)" x-text="materialTypeLabel(m.material_type)"></span>
              </td>
              <td x-text="m.filesize ? (m.filesize / 1024).toFixed(1) + ' KB' : '--'"></td>
              <td x-text="m.created_at ? LeanOps.fmtDateTime(m.created_at) : '--'"></td>
            </tr>
          </template>
        </tbody>
      </table>
      <div class="empty-state" x-show="!session.materials || session.materials.length === 0">
        <div class="empty-state-icon">
          <svg width="48" height="48" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>
        </div>
        <div class="empty-state-title">暂无课程材料</div>
        <div class="empty-state-desc">尚未上传任何培训材料</div>
      </div>
    </div>

    <!-- Feedback / Evaluation Section -->
    <div class="card" style="margin-bottom: var(--space-5);">
      <div style="padding: var(--space-5);">
        <h3 style="font-size: var(--text-lg); font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-4);">培训反馈</h3>
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg width="48" height="48" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z"/></svg>
          </div>
          <div class="empty-state-title">培训反馈</div>
          <div class="empty-state-desc">培训完成后将开放学员评价</div>
        </div>
      </div>
    </div>

  </template>

</div>
{% endblock %}
{% block scripts %}
<script>
function trainingDetail() {
  const id = window.location.pathname.split('/').pop();
  return {
    session: null,
    loading: false,
    enrollFilter: { status: '' },

    async init() {
      await this.loadSession();
    },

    async loadSession() {
      this.loading = true;
      try {
        const data = await LeanOps.api('/training/sessions/' + id);
        this.session = data.data || null;
        if (this.session && this.session.enrollments) {
          this.session.enrollments.forEach(function(e) { e._score = e.score || ''; });
        }
      } catch (e) {
        LeanOps.toast(e.detail || '加载失败', 'error');
      } finally {
        this.loading = false;
      }
    },

    filteredEnrollments() {
      if (!this.session || !this.session.enrollments) return [];
      if (!this.enrollFilter.status) return this.session.enrollments;
      return this.session.enrollments.filter(function(e) { return e.status === this.enrollFilter.status; }.bind(this));
    },

    async enrollSelf() {
      try {
        await LeanOps.api('/training/sessions/' + id + '/enroll', {
          method: 'POST',
          body: JSON.stringify({ action: 'enroll' }),
        });
        LeanOps.toast('报名成功', 'success');
        await this.loadSession();
      } catch (e) {
        LeanOps.toast(e.detail || '报名失败', 'error');
      }
    },

    async attendStudent(userId, score) {
      try {
        await LeanOps.api('/training/sessions/' + id + '/enroll', {
          method: 'POST',
          body: JSON.stringify({ action: 'attend', user_id: userId, score: score || null }),
        });
        LeanOps.toast('签到成功', 'success');
        await this.loadSession();
      } catch (e) {
        LeanOps.toast(e.detail || '签到失败', 'error');
      }
    },

    async certifyStudent(userId) {
      try {
        await LeanOps.api('/training/sessions/' + id + '/enroll', {
          method: 'POST',
          body: JSON.stringify({ action: 'certify', user_id: userId }),
        });
        LeanOps.toast('认证成功', 'success');
        await this.loadSession();
      } catch (e) {
        LeanOps.toast(e.detail || '认证失败', 'error');
      }
    },

    async cancelEnrollment(userId) {
      try {
        await LeanOps.api('/training/sessions/' + id + '/enroll', {
          method: 'POST',
          body: JSON.stringify({ action: 'cancel', user_id: userId }),
        });
        LeanOps.toast('已取消报名', 'success');
        await this.loadSession();
      } catch (e) {
        LeanOps.toast(e.detail || '取消失败', 'error');
      }
    },

    async startSession() {
      try {
        await LeanOps.api('/training/sessions/' + id, {
          method: 'PUT',
          body: JSON.stringify({ status: 'in_progress' }),
        });
        LeanOps.toast('培训已开始', 'success');
        await this.loadSession();
      } catch (e) {
        LeanOps.toast(e.detail || '操作失败', 'error');
      }
    },

    async completeSession() {
      if (!confirm('确认完成此培训？')) return;
      try {
        await LeanOps.api('/training/sessions/' + id, {
          method: 'PUT',
          body: JSON.stringify({ status: 'completed' }),
        });
        LeanOps.toast('培训已完成', 'success');
        await this.loadSession();
      } catch (e) {
        LeanOps.toast(e.detail || '操作失败', 'error');
      }
    },

    statusLabel(s) {
      const map = { scheduled: '待开始', in_progress: '进行中', completed: '已完成', cancelled: '已取消' };
      return map[s] || s;
    },

    statusBadgeClass(s) {
      const map = { scheduled: 'badge-warning', in_progress: 'badge-primary', completed: 'badge-success', cancelled: 'badge-gray' };
      return map[s] || 'badge-gray';
    },

    enrollStatusBadge(s) {
      const map = {
        enrolled: { label: '已报名', cls: 'badge-primary' },
        attended: { label: '已签到', cls: 'badge-warning' },
        certified: { label: '已认证', cls: 'badge-success' },
        cancelled: { label: '已取消', cls: 'badge-gray' }
      };
      const item = map[s] || { label: s, cls: 'badge-gray' };
      return '<span class="badge ' + item.cls + '">' + item.label + '</span>';
    },

    materialTypeLabel(t) {
      const map = { pdf: 'PDF', ppt: 'PPT', video: '视频', doc: '文档', other: '其他' };
      return map[t] || t;
    },

    materialTypeBadge(t) {
      const map = { pdf: 'badge-danger', ppt: 'badge-warning', video: 'badge-info', doc: 'badge-primary', other: 'badge-gray' };
      return map[t] || 'badge-gray';
    },
  };
}
</script>
{% endblock %}
